<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>PHINOX BOS — Diagnostics</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; min-height: 100vh; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 8px; font-size: 28px; }
    .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .refresh-btn { display: block; margin: 0 auto 24px; padding: 12px 28px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .refresh-btn:hover { background: #1d4ed8; }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; padding: 18px; border: 1px solid #334155; }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .icon { font-size: 20px; }
    .card-title { font-size: 15px; font-weight: 600; color: #f1f5f9; }
    .detail { font-size: 13px; color: #94a3b8; margin-top: 6px; line-height: 1.5; }
    .detail code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #f472b6; font-size: 12px; }
    .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 8px; }
    .status-pass { background: #064e3b; color: #34d399; }
    .status-fail { background: #450a0a; color: #f87171; }
    .status-warn { background: #451a03; color: #fbbf24; }
    .status-loading { background: #1e3a5f; color: #60a5fa; }
    #summary { max-width: 1200px; margin: 24px auto; padding: 18px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; display: none; }
    #summary h2 { color: #38bdf8; margin-top: 0; font-size: 18px; }
    .progress-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin: 10px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #34d399, #38bdf8); transition: width 0.5s; width: 0%; }
    .action-box { max-width: 1200px; margin: 16px auto; padding: 16px; background: #451a03; border-radius: 12px; border: 1px solid #92400e; display: none; }
    .action-box h3 { color: #fbbf24; margin-top: 0; font-size: 16px; }
    .action-box ul { color: #fcd34d; line-height: 1.8; margin: 8px 0; padding-right: 20px; }
    .timestamp { text-align: center; color: #64748b; font-size: 12px; margin-top: 20px; }
    .error-box { max-width: 1200px; margin: 16px auto; padding: 20px; background: #450a0a; border-radius: 12px; border: 1px solid #7f1d1d; text-align: center; }
    .error-box .icon { font-size: 40px; margin-bottom: 10px; }
    .error-box h2 { color: #f87171; margin: 0 0 10px; }
    .error-box p { color: #fca5a5; font-size: 13px; line-height: 1.6; }
    .raw-response { max-width: 1200px; margin: 16px auto; padding: 16px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; font-family: monospace; font-size: 11px; color: #94a3b8; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  </style>
<base target="_blank">
</head>
<body>
  <h1>🔬 PHINOX BOS — Diagnostics</h1>
  <p class="subtitle">فحص شامل لـ 12 نقطة حرجة — فرع v5-enterprise</p>

  <button class="refresh-btn" id="refreshBtn" onclick="runDiagnostics()">🔄 إعادة الفحص</button>

  <div class="grid" id="grid"></div>

  <div id="summary">
    <h2>📊 ملخص النتائج</h2>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <p id="summary-text"></p>
  </div>

  <div class="action-box" id="actions">
    <h3>⚡ إجراءات مطلوبة</h3>
    <ul id="action-list"></ul>
  </div>

  <p class="timestamp" id="timestamp"></p>

  <script>
    // ✅ Normalized check definitions — map any id/name to these
    var CHECK_DEFS = {
      'session': { icon: '👤', title: 'Session Email' },
      'spreadsheet': { icon: '📑', title: 'Spreadsheet Access' },
      'memberssheet': { icon: '👥', title: 'Members Sheet' },
      'membersheaders': { icon: '🏷️', title: 'Members Headers' },
      'emailmatch': { icon: '✉️', title: 'Email Match' },
      'activestatus': { icon: '✅', title: 'Active Status' },
      'roleresolved': { icon: '🛡️', title: 'Role Resolved' },
      'config': { icon: '⚙️', title: 'CONFIG Object' },
      'baserepo': { icon: '📦', title: 'BaseRepository' },
      'logger': { icon: '📝', title: 'Logger.log()' },
      'security': { icon: '🔐', title: 'Security Module' },
      'uiserver': { icon: '🌐', title: 'UI_Server Response' },
      // Alternative names from other uiDiagnose versions
      'session.getemail': { icon: '👤', title: 'Session Email' },
      'activespreadsheet': { icon: '📑', title: 'Spreadsheet Access' },
      'members sheet exists': { icon: '👥', title: 'Members Sheet' },
      'members sheet headers': { icon: '🏷️', title: 'Members Headers' },
      'user email in members': { icon: '✉️', title: 'Email Match' },
      'user status active': { icon: '✅', title: 'Active Status' },
      'user role': { icon: '🛡️', title: 'Role Resolved' },
      'config object': { icon: '⚙️', title: 'CONFIG Object' },
      'baserepository': { icon: '📦', title: 'BaseRepository' },
      'logger.log': { icon: '📝', title: 'Logger.log()' },
      'security module': { icon: '🔐', title: 'Security Module' },
      'uigetcurrentuser': { icon: '🌐', title: 'UI_Server Response' }
    };

    function normalizeResults(raw) {
      // Handle: {checks: [...]} format
      if (raw && typeof raw === 'object' && !Array.isArray(raw) && raw.checks && Array.isArray(raw.checks)) {
        return raw.checks.map(function(c) {
          var key = String(c.name || c.id || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          var def = CHECK_DEFS[key] || { icon: '🔹', title: c.name || c.id || 'Unknown' };
          return {
            id: key,
            status: c.pass === true ? 'pass' : (c.pass === false ? 'fail' : 'warn'),
            detail: c.detail || c.message || '',
            action: c.action || null,
            icon: def.icon,
            title: def.title
          };
        });
      }
      // Handle: [...] array format
      if (Array.isArray(raw)) {
        return raw.map(function(c) {
          var key = String(c.id || c.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          var def = CHECK_DEFS[key] || { icon: '🔹', title: c.id || c.name || 'Unknown' };
          return {
            id: key,
            status: c.status || (c.pass === true ? 'pass' : (c.pass === false ? 'fail' : 'warn')),
            detail: c.detail || c.message || '',
            action: c.action || null,
            icon: def.icon,
            title: def.title
          };
        });
      }
      return null;
    }

    function renderGrid(results) {
      var grid = document.getElementById('grid');
      grid.innerHTML = results.map(function(c) {
        return '<div class="card" id="card-' + c.id + '">' +
          '<div class="card-header"><span class="icon">' + c.icon + '</span><span class="card-title">' + c.title + '</span></div>' +
          '<span class="status status-loading" id="status-' + c.id + '">⏳ جاري الفحص...</span>' +
          '<div class="detail" id="detail-' + c.id + '" style="margin-top:8px;"></div>' +
          '</div>';
      }).join('');
    }

    function setStatus(id, state, detail) {
      var el = document.getElementById('status-' + id);
      var det = document.getElementById('detail-' + id);
      if (!el) return;
      el.className = 'status status-' + state;
      if (state === 'pass') el.textContent = '✅ ناجح';
      else if (state === 'fail') el.textContent = '❌ فاشل';
      else if (state === 'warn') el.textContent = '⚠️ تحذير';
      else el.textContent = '⏳ جاري...';
      if (det && detail) det.innerHTML = detail;
    }

    function runDiagnostics() {
      var btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = '⏳ جاري الفحص...';

      document.getElementById('grid').innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">⏳ جاري الاتصال بالسيرفر...</div>';
      document.getElementById('summary').style.display = 'none';
      document.getElementById('actions').style.display = 'none';

      var timeoutId = setTimeout(function() {
        showFatalError('انتهى الوقت (15 ثانية) — الكود الخلفي معلق.<br>غالباً بسبب TypeError في Logger.log أو Security.js');
        btn.disabled = false;
        btn.textContent = '🔄 إعادة الفحص';
      }, 15000);

      google.script.run
        .withSuccessHandler(function(raw) {
          clearTimeout(timeoutId);
          btn.disabled = false;
          btn.textContent = '🔄 إعادة الفحص';

          var results = normalizeResults(raw);
          if (!results) {
            showRawResponse(raw);
            return;
          }

          renderGrid(results);

          var pass = 0, fail = 0, warn = 0;
          var actions = [];

          results.forEach(function(r) {
            setStatus(r.id, r.status, r.detail);
            if (r.status === 'pass') pass++;
            else if (r.status === 'fail') fail++;
            else if (r.status === 'warn') warn++;
            if (r.action) actions.push(r.action);
          });

          var total = results.length;
          var pct = total > 0 ? Math.round((pass / total) * 100) : 0;
          document.getElementById('progress').style.width = pct + '%';
          document.getElementById('summary-text').innerHTML =
            '<strong>' + pass + '</strong> ناجح &nbsp;|&nbsp; <strong style="color:#f87171">' + fail + '</strong> فاشل &nbsp;|&nbsp; <strong style="color:#fbbf24">' + warn + '</strong> تحذير &nbsp;—&nbsp; <strong>' + pct + '%</strong> صحة النظام';
          document.getElementById('summary').style.display = 'block';

          if (actions.length > 0) {
            document.getElementById('action-list').innerHTML = actions.map(function(a) { return '<li>' + a + '</li>'; }).join('');
            document.getElementById('actions').style.display = 'block';
          }

          document.getElementById('timestamp').textContent = 'آخر فحص: ' + new Date().toLocaleString('ar-EG');
        })
        .withFailureHandler(function(err) {
          clearTimeout(timeoutId);
          btn.disabled = false;
          btn.textContent = '🔄 إعادة الفحص';
          showFatalError('خطأ من السيرفر:<br><code>' + (err && err.message ? err.message : String(err)) + '</code>');
        })
        .uiDiagnose();
    }

    function showFatalError(message) {
      document.getElementById('grid').innerHTML =
        '<div class="error-box" style="grid-column:1/-1;">' +
        '<div class="icon">💥</div>' +
        '<h2>خطأ فادح في Diagnostics</h2>' +
        '<p>' + message + '</p>' +
        '<p style="margin-top:10px;">تلميح: افتح Console (F12) وشوف الخطأ الأصلي.</p>' +
        '</div>';
      document.getElementById('timestamp').textContent = 'آخر فحص: ' + new Date().toLocaleString('ar-EG');
    }

    function showRawResponse(raw) {
      var jsonStr = '';
      try { jsonStr = JSON.stringify(raw, null, 2); } catch(e) { jsonStr = String(raw); }
      document.getElementById('grid').innerHTML =
        '<div class="error-box" style="grid-column:1/-1;">' +
        '<div class="icon">📦</div>' +
        '<h2>الرد من السيرفر في format غير متوقع</h2>' +
        '<p>الـ uiDiagnose() رجّع data مش array ولا {checks: [...]}</p>' +
        '<p>الرد الأصلي ظاهر تحت:</p>' +
        '</div>' +
        '<div class="raw-response">' + jsonStr.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
      document.getElementById('timestamp').textContent = 'آخر فحص: ' + new Date().toLocaleString('ar-EG');
    }

    window.onload = runDiagnostics;
  </script>
</body>
</html>
