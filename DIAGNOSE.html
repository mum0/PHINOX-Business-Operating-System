<!DOCTYPE html>
<html>
<head>
<base target="_blank">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHINOX Diagnostics</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', monospace; background: #0F172A; color: #E2E8F0; padding: 24px; max-width: 900px; margin: 0 auto; }
h1 { font-size: 22px; margin-bottom: 20px; color: #818CF8; }
h2 { font-size: 16px; margin: 20px 0 10px; color: #94A3B8; border-bottom: 1px solid #334155; padding-bottom: 6px; }
.test-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; margin: 4px 0; border-radius: 8px; background: #1E293B; border: 1px solid #334155; }
.test-row .label { font-weight: 600; font-size: 13px; }
.test-row .status { font-size: 13px; font-family: monospace; }
.pass { color: #4ADE80; }
.fail { color: #F87171; }
.warn { color: #FBBF24; }
.info { color: #60A5FA; }
pre { background: #0F172A; border: 1px solid #334155; border-radius: 8px; padding: 14px; margin: 8px 0; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin: 6px 4px 6px 0; }
.btn-primary { background: #6366F1; color: #fff; }
.btn-primary:hover { background: #4F46E5; }
.btn-danger { background: #DC2626; color: #fff; }
.btn-danger:hover { background: #B91C1C; }
#logOutput { margin-top: 16px; }
.log-line { padding: 3px 0; font-size: 12px; font-family: monospace; border-bottom: 1px solid #1E293B; }
.log-ok { color: #4ADE80; }
.log-err { color: #F87171; }
.log-warn { color: #FBBF24; }
.log-info { color: #60A5FA; }
</style>
</head>
<body>
<h1>PHINOX BOS v5 — Diagnostics</h1>
<p style="color:#94A3B8;margin-bottom:20px;">Run each test to identify why data is not loading.</p>

<button class="btn btn-primary" onclick="runAllTests()">Run All Tests</button>
<button class="btn btn-primary" onclick="testGoogleScript()">1. google.script.run</button>
<button class="btn btn-primary" onclick="testAuth()">2. Auth / getCurrentUser</button>
<button class="btn btn-primary" onclick="testDashboard()">3. Dashboard KPIs</button>
<button class="btn btn-danger" onclick="clearLog()">Clear Log</button>

<div id="testResults" style="margin-top:20px;"></div>
<h2>Server Log</h2>
<div id="logOutput"><div class="log-line log-info">Ready. Click a test button.</div></div>

<script>
function log(msg, type) {
  type = type || 'info';
  var el = document.getElementById('logOutput');
  var d = document.createElement('div');
  d.className = 'log-line log-' + type;
  var ts = new Date().toLocaleTimeString();
  d.textContent = '[' + ts + '] ' + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  document.getElementById('logOutput').innerHTML = '';
  document.getElementById('testResults').innerHTML = '';
}

function addResult(label, status, detail) {
  var container = document.getElementById('testResults');
  var row = document.createElement('div');
  row.className = 'test-row';
  var statusClass = status === 'PASS' ? 'pass' : status === 'FAIL' ? 'fail' : 'warn';
  row.innerHTML = '<span class="label">' + label + '</span><span class="status ' + statusClass + '">' + status + (detail ? ' — ' + detail : '') + '</span>';
  container.appendChild(row);
}

// ─── TEST 1: google.script.run availability ───
function testGoogleScript() {
  log('Testing google.script.run...', 'info');
  if (typeof google === 'undefined') {
    addResult('google object', 'FAIL', 'undefined');
    log('FAIL: google is undefined — page NOT served via GAS Web App', 'err');
    return;
  }
  if (!google.script) {
    addResult('google.script', 'FAIL', 'undefined');
    log('FAIL: google.script is undefined', 'err');
    return;
  }
  if (!google.script.run) {
    addResult('google.script.run', 'FAIL', 'undefined');
    log('FAIL: google.script.run is undefined', 'err');
    return;
  }
  addResult('google.script.run', 'PASS', 'available');
  log('PASS: google.script.run is available', 'ok');

  // Test calling a simple server function
  log('Calling uiDiagnose() on server...', 'info');
  var start = Date.now();
  google.script.run
    .withSuccessHandler(function(res) {
      var elapsed = Date.now() - start;
      addResult('Server round-trip', 'PASS', elapsed + 'ms');
      log('PASS: Server responded in ' + elapsed + 'ms', 'ok');
      log('Server response: ' + JSON.stringify(res, null, 2), 'info');
      renderDiagnoseResults(res);
    })
    .withFailureHandler(function(err) {
      var elapsed = Date.now() - start;
      addResult('Server round-trip', 'FAIL', elapsed + 'ms');
      log('FAIL: Server error after ' + elapsed + 'ms: ' + (err.message || err), 'err');
    })
    .uiDiagnose();
}

function renderDiagnoseResults(r) {
  if (!r) return;
  var items = [
    ['Session Email', r.email, !r.email || r.email.indexOf('ERROR') > -1 ? 'FAIL' : 'PASS'],
    ['Spreadsheet', r.spreadsheet, !r.spreadsheet || r.spreadsheet.indexOf('ERROR') > -1 ? 'FAIL' : 'PASS'],
    ['Members Sheet', r.membersSheet, !r.membersSheet || r.membersSheet === 'NOT FOUND' ? 'FAIL' : 'PASS'],
    ['Current Member', r.currentMember, !r.currentMember || r.currentMember === 'null' || r.currentMember.indexOf('ERROR') > -1 ? 'FAIL' : 'PASS'],
    ['BaseRepository', r.baseRepository, r.baseRepository === 'NOT DEFINED' ? 'FAIL' : 'PASS'],
    ['MEMBER_COL', r.memberCol, !r.memberCol || r.memberCol === 'NOT DEFINED' ? 'FAIL' : 'PASS'],
    ['PERMISSIONS', r.permissions, !r.permissions || r.permissions === 'NOT DEFINED' ? 'FAIL' : 'PASS'],
    ['KpiService', r.kpiService, r.kpiService === 'NOT DEFINED' ? 'FAIL' : 'PASS']
  ];
  items.forEach(function(item) {
    addResult(item[0], item[2], String(item[1] || '').substring(0, 80));
  });
}

// ─── TEST 2: Auth ───
function testAuth() {
  log('Testing uiGetCurrentUser...', 'info');
  var start = Date.now();
  google.script.run
    .withSuccessHandler(function(res) {
      var elapsed = Date.now() - start;
      log('Server responded in ' + elapsed + 'ms', 'info');
      log('Response: ' + JSON.stringify(res, null, 2), 'info');
      if (res && res.success === true && res.data) {
        addResult('uiGetCurrentUser', 'PASS', res.data.email + ' (' + res.data.role + ')');
        addResult('Permissions', 'PASS', (res.data.permissions || []).length + ' permissions');
      } else if (res && res.success === false) {
        addResult('uiGetCurrentUser', 'FAIL', res.error);
        log('AUTH FAILED: ' + res.error, 'err');
      } else {
        addResult('uiGetCurrentUser', 'WARN', 'unexpected response format');
        log('WARN: Unexpected response format: ' + JSON.stringify(res), 'warn');
      }
    })
    .withFailureHandler(function(err) {
      var elapsed = Date.now() - start;
      addResult('uiGetCurrentUser', 'FAIL', (err.message || err) + ' (' + elapsed + 'ms)');
      log('FAIL: ' + (err.message || err), 'err');
    })
    .uiGetCurrentUser();
}

// ─── TEST 3: Dashboard data ───
function testDashboard() {
  log('Testing uiGetDashboardKpis...', 'info');
  var start = Date.now();
  google.script.run
    .withSuccessHandler(function(res) {
      var elapsed = Date.now() - start;
      log('Server responded in ' + elapsed + 'ms', 'info');
      if (res && res.success === true) {
        addResult('uiGetDashboardKpis', 'PASS', JSON.stringify(res.data || {}).substring(0, 100));
        log('KPI data: ' + JSON.stringify(res.data, null, 2), 'info');
      } else if (res && res.success === false) {
        addResult('uiGetDashboardKpis', 'FAIL', res.error);
        log('FAIL: ' + res.error, 'err');
      } else {
        addResult('uiGetDashboardKpis', 'WARN', 'unexpected format');
      }
    })
    .withFailureHandler(function(err) {
      var elapsed = Date.now() - start;
      addResult('uiGetDashboardKpis', 'FAIL', (err.message || err) + ' (' + elapsed + 'ms)');
      log('FAIL: ' + (err.message || err), 'err');
      // Check if it's a missing service
      var msg = (err.message || String(err));
      if (msg.indexOf('KpiService') > -1 || msg.indexOf('is not defined') > -1) {
        log('ROOT CAUSE: A server Service is missing from GAS deployment!', 'err');
      }
      if (msg.indexOf('المستخدم') > -1 || msg.indexOf('غير مسج') > -1) {
        log('ROOT CAUSE: User not in Members sheet or not Active', 'err');
      }
    })
    .uiGetDashboardKpis();
}

// ─── RUN ALL ───
function runAllTests() {
  clearLog();
  log('=== Running ALL diagnostic tests ===', 'info');
  testGoogleScript();
  // Auth and Dashboard tests run after server responds (chained in renderDiagnoseResults)
}
</script>
</body>
</html>
