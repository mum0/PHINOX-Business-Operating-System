<!-- ─── التعديل 1: أضف زر التنقل هذا داخل قسم "النظام" (System section) ─── -->
<!-- ابحث عن زر "أعضاء الفريق" في قسم النظام وأضف بعده: -->

<!-- PLACE_AFTER: button.nav-item[data-page="members"] -->
<button class="nav-item" data-page="registrations" onclick="navigateTo('registrations')"><span class="icon">📝</span> <span class="nav-label" data-i18n="nav_registrations">طلبات التسجيل</span><span class="nav-badge" id="badge-registrations" style="display:none;">0</span></button>

<!-- ─── التعديل 2: أضف قسم الصفحة هذا بعد قسم الأعضاء (page-members) ─── -->
<!-- PLACE_AFTER: section.page-section#page-members -->
<section class="page-section" id="page-registrations">
  <h1 style="font-size:28px;font-weight:800;margin-bottom:24px;" data-i18n="page_registrations">طلبات التسجيل</h1>

  <!-- إحصائيات -->
  <div class="reg-stats-row">
    <div class="reg-stat-card">
      <div class="reg-stat-icon total">📋</div>
      <div><div class="reg-stat-number" id="regStatTotal">0</div><div class="reg-stat-label">إجمالي الطلبات</div></div>
    </div>
    <div class="reg-stat-card">
      <div class="reg-stat-icon pending">⏳</div>
      <div><div class="reg-stat-number" id="regStatPending">0</div><div class="reg-stat-label">طلبات معلقة</div></div>
    </div>
    <div class="reg-stat-card">
      <div class="reg-stat-icon approved">✅</div>
      <div><div class="reg-stat-number" id="regStatApproved">0</div><div class="reg-stat-label">مقبولة</div></div>
    </div>
    <div class="reg-stat-card">
      <div class="reg-stat-icon rejected">❌</div>
      <div><div class="reg-stat-number" id="regStatRejected">0</div><div class="reg-stat-label">مرفوضة</div></div>
    </div>
  </div>

  <!-- تبويبات -->
  <div class="reg-tabs">
    <button class="reg-tab-btn active" data-reg-tab="pending" onclick="switchRegTab('pending')">الطلبات المعلقة</button>
    <button class="reg-tab-btn" data-reg-tab="history" onclick="switchRegTab('history')">سجل الطلبات</button>
  </div>

  <!-- تبويب: الطلبات المعلقة -->
  <div class="reg-tab-content active" data-reg-tab="pending">
    <div class="reg-pending-list" id="regPendingList">
      <div class="loading"><span data-i18n="loading_registrations">جاري تحميل طلبات التسجيل...</span></div>
    </div>
    <div class="empty-state" id="regNoPending" style="display:none;padding:40px;text-align:center;">
      <div style="font-size:48px;margin-bottom:12px;">✅</div>
      <p style="color:var(--text-secondary);font-size:15px;">لا توجد طلبات تسجيل معلقة</p>
    </div>
  </div>

  <!-- تبويب: سجل الطلبات -->
  <div class="reg-tab-content" data-reg-tab="history">
    <div class="filter-bar" style="margin-bottom:16px;">
      <div class="filter-group"><label>بحث</label><input type="text" class="form-input" id="regSearch" placeholder="الاسم، البريد، رقم الطلب..." style="width:240px;" oninput="filterRegistrations()"></div>
      <div class="filter-group"><label>الحالة</label>
        <select class="form-select" id="regStatusFilter" style="width:140px;" onchange="filterRegistrations()">
          <option value="">الكل</option>
          <option value="Pending">معلق</option>
          <option value="Approved">مقبول</option>
          <option value="Rejected">مرفوض</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="loadRegistrations()">🔄 تحديث</button>
    </div>
    <div class="card">
      <div style="overflow-x:auto;">
        <table class="reg-history-table">
          <thead>
            <tr>
              <th>رقم الطلب</th>
              <th>الاسم</th>
              <th>البريد</th>
              <th>الدور</th>
              <th>القسم</th>
              <th>الحالة</th>
              <th>التاريخ</th>
            </tr>
          </thead>
          <tbody id="regHistoryBody">
            <tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-secondary);">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
