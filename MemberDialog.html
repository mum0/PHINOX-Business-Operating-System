<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
    body{background:#f5f5f5;padding:20px;direction:rtl;}
    h2{color:#1a237e;margin-bottom:20px;font-size:18px;border-bottom:2px solid #e0e0e0;padding-bottom:10px;}
    .form-group{margin-bottom:15px;}
    label{display:block;font-size:13px;font-weight:700;color:#555;margin-bottom:5px;}
    input,select{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:#fff;}
    input:focus,select:focus{outline:none;border-color:#1a237e;}
    .error{color:#C62828;font-size:12px;margin-top:4px;display:none;}
    .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:25px;}
    .btn{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;}
    .btn-primary{background:#1a237e;color:#fff;}
    .btn-secondary{background:#e0e0e0;color:#333;}
    .toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#37474f;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:9999;}
  </style>
</head>
<body>
  <h2>👤 إضافة عضو جديد</h2>

  <div class="form-group">
    <label>الاسم الكامل *</label>
    <input type="text" id="name" placeholder="مثال: أحمد محمد">
    <div class="error" id="err-name">الاسم مطلوب</div>
  </div>

  <div class="form-group">
    <label>الدور *</label>
    <select id="role">
      <option value="CEO">CEO</option>
      <option value="Partner">Partner</option>
      <option value="Designer">Designer</option>
      <option value="Marketing">Marketing</option>
      <option value="Operations">Operations</option>
      <option value="Customer Service">Customer Service</option>
      <option value="Finance">Finance</option>
    </select>
  </div>

  <div class="form-group">
    <label>البريد الإلكتروني *</label>
    <input type="email" id="email" placeholder="example@domain.com">
    <div class="error" id="err-email">بريد إلكتروني صحيح مطلوب</div>
  </div>

  <div class="form-group">
    <label>رقم الهاتف</label>
    <input type="text" id="phone" placeholder="مثال: 01234567890">
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="google.script.host.close()">إلغاء</button>
    <button class="btn btn-primary" onclick="submitMember()">💾 حفظ العضو</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function validate(){
      let ok = true;
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if(!name){
        document.getElementById('err-name').style.display = 'block';
        ok = false;
      } else {
        document.getElementById('err-name').style.display = 'none';
      }

      if(!emailRegex.test(email)){
        document.getElementById('err-email').style.display = 'block';
        ok = false;
      } else {
        document.getElementById('err-email').style.display = 'none';
      }

      return ok;
    }

    function submitMember(){
      if(!validate()) return;

      const btn = document.querySelector('.btn-primary');
      btn.textContent = '⏳ جاري الحفظ...';
      btn.disabled = true;

      const data = {
        name: document.getElementById('name').value.trim(),
        role: document.getElementById('role').value,
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim()
      };

      google.script.run
        .withSuccessHandler(res => {
          if(res.success){
            showToast('✅ ' + res.message);
            setTimeout(() => google.script.run.showDashboardUI(), 1200);
          } else {
            showToast('❌ ' + res.error, true);
            btn.textContent = '💾 حفظ العضو';
            btn.disabled = false;
          }
        })
        .withFailureHandler(err => {
          showToast('❌ ' + err.message, true);
          btn.textContent = '💾 حفظ العضو';
          btn.disabled = false;
        })
        .addMemberFromDialog(data);
    }

    function showToast(msg, isError){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = isError ? '#C62828' : '#37474f';
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
  </script>
</body>
</html>
