<script>
// ═══════════════════════════════════════════════════════
// TASKS
// ═══════════════════════════════════════════════════════
function loadTasks() {
  var from = document.getElementById('taskDateFrom').value;
  var to = document.getElementById('taskDateTo').value;
  callServer('uiGetTasksByDateRange', from, to).then(function(res) {
    _taskCache = (res.data && res.data.data) || res.data || [];
    renderTasks(_taskCache);
  }).catch(function(err) {
    document.getElementById('tasksTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

function renderTasks(list) {
  if (!list || !list.length) {
    document.getElementById('tasksTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">✓</div><p>No tasks found</p></div>';
    return;
  }
  var html = '<table class="table"><thead><tr><th>Title</th><th>Assignee</th><th>Due</th><th>Priority</th><th>Status</th></tr></thead><tbody>';
  list.forEach(function(t) {
    var status = t.status || 'Pending';
    var badgeClass = status === 'Completed' ? 'badge-success' : status === 'Overdue' ? 'badge-danger' : 'badge-warning';
    html += '<tr><td>' + esc(t.title || '-') + '</td><td>' + esc(t.assignee || '-') + '</td><td>' + formatDate(t.dueDate) + '</td>';
    html += '<td>' + esc(t.priority || '-') + '</td><td><span class="badge ' + badgeClass + '">' + esc(status) + '</span></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tasksTableContainer').innerHTML = html;
}

function filterTasks() {
  var status = document.getElementById('taskStatusFilter').value;
  var filtered = _taskCache.filter(function(t) {
    return !status || (t.status || 'Pending') === status;
  });
  renderTasks(filtered);
}

function openAddTaskModal() {
  openGenericModal('New Task',
    '<div class="form-group"><label class="form-label">Title *</label><input type="text" class="form-input" id="taskTitle" placeholder="Task title"></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Assignee</label><input type="text" class="form-input" id="taskAssignee" placeholder="Email or name"></div>' +
    '<div class="form-group"><label class="form-label">Due Date</label><input type="date" class="form-input" id="taskDue"></div></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="taskPriority"><option value="Low">Low</option><option value="Medium" selected>Medium</option><option value="High">High</option><option value="Critical">Critical</option></select></div>' +
    '<div class="form-group"><label class="form-label">Status</label><select class="form-select" id="taskStatus"><option value="Not Started" selected>Not Started</option><option value="In Progress">In Progress</option></select></div></div>' +
    '<div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea" id="taskDesc" rows="2"></textarea></div>',
    '<button class="btn btn-primary" data-action="submit-add-task">Create</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitAddTask() {
  var data = {
    title: document.getElementById('taskTitle').value,
    assignedTo: document.getElementById('taskAssignee').value,
    dueDate: document.getElementById('taskDue').value || '',
    priority: document.getElementById('taskPriority').value || 'Medium',
    difficulty: 'Medium',
    status: document.getElementById('taskStatus').value || 'Not Started',
    notes: document.getElementById('taskDesc').value || ''
  };
  if (!data.title || !data.assignedTo) { showToast('Title and assignee are required', 'error'); return; }
  callServer('uiCreateTask', data).then(function() {
    showToast('Task created');
    closeModal();
    loadTasks();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

// ═══════════════════════════════════════════════════════
// MARKETING
// ═══════════════════════════════════════════════════════
function loadMarketing() {
  var from = document.getElementById('marketingDateFrom').value;
  var to = document.getElementById('marketingDateTo').value;
  callServer('uiGetMarketingStats', from, to).then(function(res) {
    var stats = res.data || {};
    var html = '<div class="kpi-card"><div class="kpi-label">Total Spend</div><div class="kpi-value">$' + esc(String(stats.spend || 0)) + '</div></div>';
    html += '<div class="kpi-card"><div class="kpi-label">Leads</div><div class="kpi-value">' + esc(String(stats.leads || 0)) + '</div></div>';
    html += '<div class="kpi-card"><div class="kpi-label">ROAS</div><div class="kpi-value">' + esc(String(stats.roas || 0)) + 'x</div></div>';
    document.getElementById('marketingKpis').innerHTML = html;
  }).catch(function() {
    document.getElementById('marketingKpis').innerHTML = '<div class="kpi-card"><div class="kpi-label">Error</div><div class="kpi-value">-</div></div>';
  });

  callServer('uiGetMarketingRecords', { limit: 100 }).then(function(res) {
    _marketingCache = (res.data && res.data.data) || res.data || [];
    if (!_marketingCache.length) {
      document.getElementById('marketingTableContainer').innerHTML = '<div class="empty-state"><p>No marketing records</p></div>';
      return;
    }
    var html = '<table class="table"><thead><tr><th>Date</th><th>Campaign</th><th>Channel</th><th>Spend</th><th>Leads</th></tr></thead><tbody>';
    _marketingCache.forEach(function(m) {
      html += '<tr><td>' + formatDate(m.date || m.createdAt) + '</td><td>' + esc(m.campaign || '-') + '</td><td>' + esc(m.channel || '-') + '</td>';
      html += '<td>$' + esc(String(m.spend || 0)) + '</td><td>' + esc(String(m.leads || 0)) + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('marketingTableContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('marketingTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

function openAddMarketingModal() {
  openGenericModal('Add Marketing Record',
    '<div class="form-row"><div class="form-group"><label class="form-label">Campaign *</label><input type="text" class="form-input" id="mktCampaign" placeholder="Campaign name"></div>' +
    '<div class="form-group"><label class="form-label">Platform</label><select class="form-select" id="mktPlatform"><option value="Meta">Meta</option><option value="Google">Google</option><option value="TikTok">TikTok</option><option value="LinkedIn">LinkedIn</option><option value="Other" selected>Other</option></select></div>' +
    '<div class="form-group"><label class="form-label">Channel</label><select class="form-select" id="mktChannel"><option value="Paid Social" selected>Paid Social</option><option value="Search">Search</option><option value="Display">Display</option><option value="Video">Video</option><option value="Email">Email</option><option value="Affiliate">Affiliate</option><option value="Other">Other</option></select></div></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Spend</label><input type="number" step="0.01" class="form-input" id="mktSpend" value="0"></div>' +
    '<div class="form-group"><label class="form-label">Leads</label><input type="number" class="form-input" id="mktLeads" value="0"></div></div>',
    '<button class="btn btn-primary" data-action="submit-add-marketing">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitAddMarketing() {
  var campaign = document.getElementById('mktCampaign').value;
  var data = {
    date: new Date(),
    platform: document.getElementById('mktPlatform').value || 'Other',
    campaignName: campaign,
    channel: document.getElementById('mktChannel').value || 'Paid Social',
    currency: 'EGP',
    spend: parseFloat(document.getElementById('mktSpend').value) || 0,
    leads: parseFloat(document.getElementById('mktLeads').value) || 0
  };
  if (!data.campaignName) { showToast('Campaign name is required', 'error'); return; }
  callServer('uiCreateMarketingRecord', data).then(function() {
    showToast('Record added');
    closeModal();
    loadMarketing();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}
</script>
