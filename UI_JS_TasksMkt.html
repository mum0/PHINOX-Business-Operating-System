<script>
// ═══════════════════════════════════════════════════════
// TASKS
// ═══════════════════════════════════════════════════════
function loadTasks() {
  var from = document.getElementById('taskDateFrom').value;
  var to = document.getElementById('taskDateTo').value;
  callServer('uiGetTasksByDateRange', from, to).then(function(res) {
    _taskCache = (res.data && res.data.data) || res.data || [];
    renderTasks(_taskCache);
  }).catch(function(err) {
    document.getElementById('tasksTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

function renderTasks(list) {
  if (!list || !list.length) {
    document.getElementById('tasksTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">✓</div><p>No tasks found</p></div>';
    return;
  }
  var canApprove = hasPerm('tasks:approve') || isAdmin();
  var html = '<table class="table"><thead><tr><th>Title</th><th>Assignee</th><th>Due</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  list.forEach(function(t) {
    var status = t.status || 'Pending';
    var badgeClass = status === 'Completed' ? 'badge-success' : status === 'Overdue' ? 'badge-danger' : 'badge-warning';
    var tid = t.id || '-';
    html += '<tr><td>' + esc(t.title || '-') + '</td><td>' + esc(t.assignee || '-') + '</td><td>' + formatDate(t.dueDate) + '</td>';
    html += '<td>' + esc(t.priority || '-') + '</td><td><span class="badge ' + badgeClass + '">' + esc(status) + '</span></td>';
    html += '<td><div class="btn-group">';
    html += '<button class="btn btn-sm btn-outline" data-action="edit-task" data-id="' + escAttr(tid) + '">Edit</button>';
    if (status === 'Completed' || status === 'Overdue') {
      html += '<button class="btn btn-sm btn-danger" data-action="delete-task" data-id="' + escAttr(tid) + '">Delete</button>';
    }
    if (canApprove && (status === 'Pending' || status === 'In Progress')) {
      html += '<button class="btn btn-sm btn-success" data-action="approve-task" data-id="' + escAttr(tid) + '">Approve</button>';
      html += '<button class="btn btn-sm btn-danger" data-action="open-reject-task" data-id="' + escAttr(tid) + '">Reject</button>';
    }
    html += '</div></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tasksTableContainer').innerHTML = html;
}

function filterTasks() {
  var status = document.getElementById('taskStatusFilter').value;
  var filtered = _taskCache.filter(function(t) {
    return !status || (t.status || 'Pending') === status;
  });
  renderTasks(filtered);
}

function openAddTaskModal() {
  openGenericModal('New Task',
    '<div class="form-group"><label class="form-label">Title *</label><input type="text" class="form-input" id="taskTitle" placeholder="Task title"></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Assignee</label><input type="text" class="form-input" id="taskAssignee" placeholder="Email or name"></div>' +
    '<div class="form-group"><label class="form-label">Due Date</label><input type="date" class="form-input" id="taskDue"></div></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="taskPriority"><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select></div>' +
    '<div class="form-group"><label class="form-label">Status</label><select class="form-select" id="taskStatus"><option value="Pending">Pending</option><option value="In Progress">In Progress</option></select></div></div>' +
    '<div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="taskDesc" rows="2"></textarea></div>',
    '<button class="btn btn-primary" data-action="submit-add-task">Create</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitAddTask() {
  var data = {
    title: document.getElementById('taskTitle').value,
    assignee: document.getElementById('taskAssignee').value,
    dueDate: document.getElementById('taskDue').value,
    priority: document.getElementById('taskPriority').value,
    status: document.getElementById('taskStatus').value,
    description: document.getElementById('taskDesc').value
  };
  if (!data.title) { showToast('Title is required', 'error'); return; }
  callServer('uiCreateTask', data).then(function() {
    showToast('Task created');
    closeModal();
    loadTasks();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function openEditTaskModal(id) {
  var task = _taskCache.find(function(t) { return (t.id || '') === id; });
  if (!task) return;
  openGenericModal('Edit Task',
    '<div class="form-group"><label class="form-label">Title *</label><input type="text" class="form-input" id="editTaskTitle" value="' + escAttr(task.title || '') + '"></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Assignee</label><input type="text" class="form-input" id="editTaskAssignee" value="' + escAttr(task.assignee || '') + '"></div>' +
    '<div class="form-group"><label class="form-label">Due Date</label><input type="date" class="form-input" id="editTaskDue" value="' + escAttr(task.dueDate || '') + '"></div></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="editTaskPriority"><option value="Low"' + (task.priority === 'Low' ? ' selected' : '') + '>Low</option><option value="Medium"' + (task.priority === 'Medium' ? ' selected' : '') + '>Medium</option><option value="High"' + (task.priority === 'High' ? ' selected' : '') + '>High</option></select></div>' +
    '<div class="form-group"><label class="form-label">Status</label><select class="form-select" id="editTaskStatus"><option value="Pending"' + (task.status === 'Pending' ? ' selected' : '') + '>Pending</option><option value="In Progress"' + (task.status === 'In Progress' ? ' selected' : '') + '>In Progress</option><option value="Completed"' + (task.status === 'Completed' ? ' selected' : '') + '>Completed</option><option value="Overdue"' + (task.status === 'Overdue' ? ' selected' : '') + '>Overdue</option></select></div></div>' +
    '<div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="editTaskDesc" rows="2">' + esc(task.description || '') + '</textarea></div>',
    '<button class="btn btn-primary" data-action="submit-edit-task" data-id="' + escAttr(id) + '">Update</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitEditTask(id) {
  var data = {
    title: document.getElementById('editTaskTitle').value,
    assignee: document.getElementById('editTaskAssignee').value,
    dueDate: document.getElementById('editTaskDue').value,
    priority: document.getElementById('editTaskPriority').value,
    status: document.getElementById('editTaskStatus').value,
    description: document.getElementById('editTaskDesc').value
  };
  if (!data.title) { showToast('Title is required', 'error'); return; }
  callServer('uiUpdateTask', id, data).then(function() {
    showToast('Task updated');
    closeModal();
    loadTasks();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  callServer('uiDeleteTask', id).then(function() {
    showToast('Task deleted');
    loadTasks();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function approveTaskAction(id) {
  callServer('uiApproveTask', id).then(function() {
    showToast('Task approved');
    loadTasks();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function openRejectTaskModal(id) {
  openGenericModal('Reject Task',
    '<div class="form-group"><label class="form-label">Rejection Reason *</label><textarea class="form-textarea" id="rejectTaskReason" rows="3" placeholder="Why is this task being rejected?"></textarea></div>',
    '<button class="btn btn-danger" data-action="submit-reject-task" data-id="' + escAttr(id) + '">Reject Task</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitRejectTask(id) {
  var reason = document.getElementById('rejectTaskReason').value;
  if (!reason) { showToast('Reason is required', 'error'); return; }
  callServer('uiRejectTask', id, reason).then(function() {
    showToast('Task rejected');
    closeModal();
    loadTasks();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

// ═══════════════════════════════════════════════════════
// MARKETING
// ═══════════════════════════════════════════════════════
function loadMarketing() {
  var from = document.getElementById('marketingDateFrom').value;
  var to = document.getElementById('marketingDateTo').value;
  callServer('uiGetMarketingStats', from, to).then(function(res) {
    var stats = res.data || {};
    var html = '<div class="kpi-card"><div class="kpi-label">Total Spend</div><div class="kpi-value">$' + esc(String(stats.spend || 0)) + '</div></div>';
    html += '<div class="kpi-card"><div class="kpi-label">Leads</div><div class="kpi-value">' + esc(String(stats.leads || 0)) + '</div></div>';
    html += '<div class="kpi-card"><div class="kpi-label">ROAS</div><div class="kpi-value">' + esc(String(stats.roas || 0)) + 'x</div></div>';
    document.getElementById('marketingKpis').innerHTML = html;
  }).catch(function() {
    document.getElementById('marketingKpis').innerHTML = '<div class="kpi-card"><div class="kpi-label">Error</div><div class="kpi-value">-</div></div>';
  });
  
  callServer('uiGetMarketingRecords', { limit: 100 }).then(function(res) {
    _marketingCache = (res.data && res.data.data) || res.data || [];
    if (!_marketingCache.length) {
      document.getElementById('marketingTableContainer').innerHTML = '<div class="empty-state"><p>No marketing records</p></div>';
      return;
    }
    var html = '<table class="table"><thead><tr><th>Date</th><th>Campaign</th><th>Channel</th><th>Spend</th><th>Leads</th></tr></thead><tbody>';
    _marketingCache.forEach(function(m) {
      html += '<tr><td>' + formatDate(m.date || m.createdAt) + '</td><td>' + esc(m.campaign || '-') + '</td><td>' + esc(m.channel || '-') + '</td>';
      html += '<td>$' + esc(String(m.spend || 0)) + '</td><td>' + esc(String(m.leads || 0)) + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('marketingTableContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('marketingTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

function openAddMarketingModal() {
  openGenericModal('Add Marketing Record',
    '<div class="form-row"><div class="form-group"><label class="form-label">Campaign *</label><input type="text" class="form-input" id="mktCampaign" placeholder="Campaign name"></div>' +
    '<div class="form-group"><label class="form-label">Channel</label><select class="form-select" id="mktChannel"><option value="Social">Social</option><option value="Email">Email</option><option value="PPC">PPC</option><option value="SEO">SEO</option><option value="Other">Other</option></select></div></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Spend</label><input type="number" step="0.01" class="form-input" id="mktSpend" value="0"></div>' +
    '<div class="form-group"><label class="form-label">Leads</label><input type="number" class="form-input" id="mktLeads" value="0"></div></div>',
    '<button class="btn btn-primary" data-action="submit-add-marketing">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitAddMarketing() {
  var data = {
    campaign: document.getElementById('mktCampaign').value,
    channel: document.getElementById('mktChannel').value,
    spend: parseFloat(document.getElementById('mktSpend').value) || 0,
    leads: parseFloat(document.getElementById('mktLeads').value) || 0
  };
  if (!data.campaign) { showToast('Campaign name is required', 'error'); return; }
  callServer('uiCreateMarketingRecord', data).then(function() {
    showToast('Record added');
    closeModal();
    loadMarketing();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

// ═══════════════════════════════════════════════════════
// SOCIAL
// ═══════════════════════════════════════════════════════
function loadSocial() {
  var from = document.getElementById('socialDateFrom').value;
  var to = document.getElementById('socialDateTo').value;
  callServer('uiGetSocialStats', from, to).then(function(res) {
    var stats = res.data || {};
    var html = '<div class="kpi-card"><div class="kpi-label">Followers</div><div class="kpi-value">' + esc(String(stats.followers || 0)) + '</div></div>';
    html += '<div class="kpi-card"><div class="kpi-label">Engagement</div><div class="kpi-value">' + esc(String(stats.engagementRate || 0)) + '%</div></div>';
    html += '<div class="kpi-card"><div class="kpi-label">Reach</div><div class="kpi-value">' + esc(String(stats.reach || 0)) + '</div></div>';
    document.getElementById('socialKpis').innerHTML = html;
  }).catch(function() {
    document.getElementById('socialKpis').innerHTML = '<div class="kpi-card"><div class="kpi-label">Error</div><div class="kpi-value">-</div></div>';
  });
  
  callServer('uiGetSocialRecords', { limit: 100 }).then(function(res) {
    _socialCache = (res.data && res.data.data) || res.data || [];
    if (!_socialCache.length) {
      document.getElementById('socialTableContainer').innerHTML = '<div class="empty-state"><p>No social records</p></div>';
      return;
    }
    var html = '<table class="table"><thead><tr><th>Date</th><th>Platform</th><th>Post</th><th>Likes</th><th>Shares</th></tr></thead><tbody>';
    _socialCache.forEach(function(s) {
      html += '<tr><td>' + formatDate(s.date || s.createdAt) + '</td><td>' + esc(s.platform || '-') + '</td><td>' + esc(s.content || s.post || '-').substring(0, 50) + '...</td>';
      html += '<td>' + esc(String(s.likes || 0)) + '</td><td>' + esc(String(s.shares || 0)) + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('socialTableContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('socialTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

function openAddSocialModal() {
  openGenericModal('Add Social Record',
    '<div class="form-row"><div class="form-group"><label class="form-label">Platform *</label><select class="form-select" id="socPlatform"><option value="Facebook">Facebook</option><option value="Instagram">Instagram</option><option value="Twitter">Twitter</option><option value="LinkedIn">LinkedIn</option><option value="TikTok">TikTok</option></select></div>' +
    '<div class="form-group"><label class="form-label">Post Type</label><select class="form-select" id="socType"><option value="Image">Image</option><option value="Video">Video</option><option value="Text">Text</option><option value="Story">Story</option></select></div></div>' +
    '<div class="form-group"><label class="form-label">Content</label><textarea class="form-textarea" id="socContent" rows="3" placeholder="Post content..."></textarea></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Likes</label><input type="number" class="form-input" id="socLikes" value="0"></div>' +
    '<div class="form-group"><label class="form-label">Shares</label><input type="number" class="form-input" id="socShares" value="0"></div></div>',
    '<button class="btn btn-primary" data-action="submit-add-social">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitAddSocial() {
  var data = {
    platform: document.getElementById('socPlatform').value,
    postType: document.getElementById('socType').value,
    content: document.getElementById('socContent').value,
    likes: parseFloat(document.getElementById('socLikes').value) || 0,
    shares: parseFloat(document.getElementById('socShares').value) || 0
  };
  if (!data.platform) { showToast('Platform is required', 'error'); return; }
  callServer('uiCreateSocialRecord', data).then(function() {
    showToast('Record added');
    closeModal();
    loadSocial();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}
</script>
