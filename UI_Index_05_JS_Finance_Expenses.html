<script>
// ═══════════════════════════════════════════════════════
// FINANCE
// ═══════════════════════════════════════════════════════
function loadFinance() {
  var from = document.getElementById('financeDateFrom').value;
  var to = document.getElementById('financeDateTo').value;
  callServer('uiGetFinanceStats', from, to).then(function(res) {
    var stats = res.data || {};
    var pnl = stats.pnl || {};
    var revenue = pnl.revenue || 0;
    var expenses = pnl.expenses || 0;
    var netProfit = revenue - expenses;
    var html = '';
    var items = [
      { label: 'Total Revenue', value: revenue },
      { label: 'Total Expenses', value: expenses },
      { label: 'Net Profit', value: netProfit }
    ];
    items.forEach(function(k) {
      var colorClass = k.label === 'Net Profit' && k.value < 0 ? 'text-danger' : 'text-success';
      html += '<div class="kpi-card"><div class="kpi-label">' + esc(k.label) + '</div><div class="kpi-value ' + colorClass + '">$' + esc(String(k.value)) + '</div></div>';
    });
    document.getElementById('financeKpis').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('financeKpis').innerHTML = '<div class="kpi-card"><div class="kpi-label">Error</div><div class="kpi-value" style="font-size:14px;">' + esc(err.message) + '</div></div>';
  });
  
  callServer('uiGetLedger', { limit: 100 }).then(function(res) {
    var entries = (res.data && res.data.data) || res.data || [];
    if (!entries.length) {
      document.getElementById('ledgerTableContainer').innerHTML = '<div class="empty-state"><p>No ledger entries</p></div>';
      return;
    }
    var html = '<table class="table"><thead><tr><th>Date</th><th>Account</th><th>Description</th><th>Debit</th><th>Credit</th></tr></thead><tbody>';
    entries.forEach(function(e) {
      html += '<tr><td>' + formatDate(e.date || e.createdAt) + '</td><td>' + esc(e.account || '-') + '</td><td>' + esc(e.description || '-') + '</td>';
      html += '<td class="text-success">$' + esc(String(e.debit || 0)) + '</td><td class="text-danger">$' + esc(String(e.credit || 0)) + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('ledgerTableContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('ledgerTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

// ═══════════════════════════════════════════════════════
// EXPENSES
// ═══════════════════════════════════════════════════════
function loadExpenses() {
  callServer('uiGetExpenses', { limit: 1000 }).then(function(res) {
    _expenseCache = (res.data && res.data.data) || res.data || [];
    renderExpenses(_expenseCache);
  }).catch(function(err) {
    document.getElementById('expensesTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

function renderExpenses(list) {
  var filtered = list.filter(function(e) {
    if (_expenseTab === 'all') return true;
    return (e.status || '').toLowerCase() === _expenseTab;
  });
  if (!filtered.length) {
    document.getElementById('expensesTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🧾</div><p>No expenses found</p></div>';
    return;
  }
  var html = '<table class="table"><thead><tr><th>ID</th><th>Date</th><th>Category</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  filtered.forEach(function(e) {
    var status = e.status || 'Pending';
    var badgeClass = status === 'Approved' ? 'badge-success' : status === 'Rejected' ? 'badge-danger' : status === 'Posted' ? 'badge-info' : 'badge-warning';
    html += '<tr><td>' + esc(e.id || '-') + '</td><td>' + formatDate(e.date || e.createdAt) + '</td><td>' + esc(e.category || '-') + '</td>';
    html += '<td>$' + esc(String(e.amount || 0)) + '</td><td><span class="badge ' + badgeClass + '">' + esc(status) + '</span></td>';
    html += '<td><div class="btn-group">';
    if (status === 'Pending' && hasPerm('expenses:approve')) {
      html += '<button class="btn btn-sm btn-success" data-action="approve-expense" data-id="' + escAttr(e.id) + '">Approve</button>';
      html += '<button class="btn btn-sm btn-danger" data-action="open-reject-expense" data-id="' + escAttr(e.id) + '">Reject</button>';
    }
    if (status === 'Approved' && hasPerm('expenses:approve')) {
      html += '<button class="btn btn-sm btn-primary" data-action="open-post-expense" data-id="' + escAttr(e.id) + '">Post</button>';
    }
    if (hasPerm('expenses:delete')) {
      html += '<button class="btn btn-sm btn-danger" data-action="delete-expense" data-id="' + escAttr(e.id) + '">Delete</button>';
    }
    html += '</div></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('expensesTableContainer').innerHTML = html;
}

function switchExpenseTab(el, tab) {
  _expenseTab = tab;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  renderExpenses(_expenseCache);
}

function openAddExpenseModal() {
  openGenericModal('New Expense',
    '<div class="form-row"><div class="form-group"><label class="form-label">Category *</label><select class="form-select" id="expCategory"><option value="Office">Office</option><option value="Travel">Travel</option><option value="Meals">Meals</option><option value="Equipment">Equipment</option><option value="Other">Other</option></select></div>' +
    '<div class="form-group"><label class="form-label">Amount *</label><input type="number" step="0.01" class="form-input" id="expAmount" placeholder="0.00"></div></div>' +
    '<div class="form-group"><label class="form-label">Description *</label><textarea class="form-textarea" id="expDesc" rows="2" placeholder="Expense description..."></textarea></div>' +
    '<div class="form-group"><label class="form-label">Receipt URL</label><input type="text" class="form-input" id="expReceipt" placeholder="https://..."></div>',
    '<button class="btn btn-primary" data-action="submit-add-expense">Submit</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitAddExpense() {
  var data = {
    category: document.getElementById('expCategory').value,
    amount: parseFloat(document.getElementById('expAmount').value) || 0,
    description: document.getElementById('expDesc').value,
    receiptUrl: document.getElementById('expReceipt').value
  };
  if (!data.category || !data.amount || !data.description) { showToast('All fields are required', 'error'); return; }
  callServer('uiCreateExpense', data).then(function() {
    showToast('Expense submitted');
    closeModal();
    loadExpenses();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function approveExpense(id) {
  callServer('uiApproveExpense', id).then(function() {
    showToast('Expense approved');
    loadExpenses();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function openRejectExpenseModal(id) {
  document.getElementById('rejectExpenseId').value = id;
  document.getElementById('rejectExpenseReason').value = '';
  openModal('modalRejectExpense');
}

function submitRejectExpense() {
  var id = document.getElementById('rejectExpenseId').value;
  var reason = document.getElementById('rejectExpenseReason').value;
  if (!reason) { showToast('Reason is required', 'error'); return; }
  callServer('uiRejectExpense', id, reason).then(function() {
    showToast('Expense rejected');
    closeModal('modalRejectExpense');
    loadExpenses();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function openPostExpenseModal(id) {
  document.getElementById('postExpenseId').value = id;
  document.getElementById('postExpenseAccount').value = '';
  openModal('modalPostExpense');
}

function submitPostExpense() {
  var id = document.getElementById('postExpenseId').value;
  var account = document.getElementById('postExpenseAccount').value;
  if (!account) { showToast('Account is required', 'error'); return; }
  callServer('uiPostExpense', id, account).then(function() {
    showToast('Expense posted to ledger');
    closeModal('modalPostExpense');
    loadExpenses();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function deleteExpense(id) {
  if (!confirm('Are you sure you want to delete this expense?')) return;
  callServer('uiDeleteExpense', id).then(function() {
    showToast('Expense deleted');
    loadExpenses();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function loadApprovals() {
  callServer('uiGetExpenses', { limit: 1000 }).then(function(res) {
    var all = (res.data && res.data.data) || res.data || [];
    var pending = all.filter(function(e) { return (e.status || 'Pending') === 'Pending'; });
    if (!pending.length) {
      document.getElementById('approvalsTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div><p>No pending approvals</p></div>';
      return;
    }
    var html = '<table class="table"><thead><tr><th>ID</th><th>Date</th><th>Requester</th><th>Category</th><th>Amount</th><th>Description</th><th>Actions</th></tr></thead><tbody>';
    pending.forEach(function(e) {
      html += '<tr><td>' + esc(e.id || '-') + '</td><td>' + formatDate(e.date || e.createdAt) + '</td><td>' + esc(e.requester || e.createdBy || '-') + '</td>';
      html += '<td>' + esc(e.category || '-') + '</td><td>$' + esc(String(e.amount || 0)) + '</td><td>' + esc(e.description || '-') + '</td>';
      html += '<td><div class="btn-group"><button class="btn btn-sm btn-success" data-action="approve-expense" data-id="' + escAttr(e.id) + '">Approve</button><button class="btn btn-sm btn-danger" data-action="open-reject-expense" data-id="' + escAttr(e.id) + '">Reject</button></div></td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('approvalsTableContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('approvalsTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

</script>
