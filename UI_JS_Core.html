// ─── SERVER BRIDGE (Fixed for GAS V8) ───
function callServer(action) {
  return new Promise(function(resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject(new Error('google.script.run ' + t('auth_error')));
      return;
    }
    var runner = google.script.run
      .withSuccessHandler(function(res) {
        if (res && typeof res === 'object' && res.success === true && 'data' in res) {
          resolve({ data: res.data });
        } else if (res && typeof res === 'object' && res.success === false && res.error) {
          reject(new Error(res.error));
        } else {
          resolve({ data: res });
        }
      })
      .withFailureHandler(function(err) {
        var msg = (err && err.message) ? err.message : String(err);
        reject(new Error(msg));
      });
    var fn = runner[action];
    if (typeof fn === 'function') {
      var args = Array.prototype.slice.call(arguments, 1);
      fn.apply(runner, args);
    } else {
      reject(new Error('Server function "' + action + '" not found'));
    }
  });
}

// ─── XSS ESCAPE ───
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── TOASTS ───
function showToast(message, type) {
  type = type || 'success';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  var icon = type === 'success' ? '\u2705' : type === 'error' ? '\u274C' : type === 'warning' ? '\u26A0\uFE0F' : '\u2139\uFE0F';
  toast.innerHTML = '<span style="font-size:18px">' + icon + '</span><span>' + esc(message) + '</span>';
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(20px)';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

// ─── MODALS ───
function openModal(id) {
  var el = document.getElementById(id || 'modalGeneric');
  if (el) el.classList.add('active');
}
function closeModal(id) {
  if (id) {
    var el = document.getElementById(id);
    if (el) el.classList.remove('active');
  } else {
    document.querySelectorAll('.modal-overlay').forEach(function(el) { el.classList.remove('active'); });
  }
}
function openGenericModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalGenericTitle').textContent = title || '';
  document.getElementById('modalGenericBody').innerHTML = bodyHtml || '';
  document.getElementById('modalGenericFooter').innerHTML = footerHtml || '';
  openModal('modalGeneric');
}

// ─── DATE FORMATTERS ───
function formatDate(dt) {
  if (!dt) return '-';
  var d = new Date(dt);
  if (isNaN(d.getTime())) return String(dt);
  var locale = _currentLang === 'ar' ? 'ar-EG' : 'en-US';
  return d.toLocaleDateString(locale, { year: 'numeric', month: 'short', day: 'numeric' });
}
function formatDateTime(dt) {
  if (!dt) return '-';
  var d = new Date(dt);
  if (isNaN(d.getTime())) return String(dt);
  var locale = _currentLang === 'ar' ? 'ar-EG' : 'en-US';
  return d.toLocaleDateString(locale, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ─── PERMISSIONS ───
function hasPerm(perm) {
  if (!_currentUser || !_currentUser.permissions) return false;
  var perms = _currentUser.permissions;
  if (perms.indexOf('*') > -1 || perms.indexOf('admin') > -1 || perms.indexOf('Admin') > -1) return true;
  return perms.indexOf(perm) > -1;
}
function isAdmin() {
  return hasPerm('admin') || (_currentUser && (_currentUser.role === 'Admin' || _currentUser.role === 'CEO'));
}

// ─── LOGOUT ───
function handleLogout() {
  if (confirm(_currentLang === 'ar' ? 'هل تريد تسجيل الخروج؟' : 'Do you want to logout?')) {
    try { google.script.host.close(); } catch(e) {
      window.location.href = window.location.href;
    }
  }
}

var _authRetryCount = 0;

function showAuthOverlay() {
  var existing = document.getElementById('authOverlay');
  if (existing) { existing.style.display = 'flex'; return; }

  var overlay = document.createElement('div');
  overlay.id = 'authOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:var(--bg-primary,rgba(15,23,42,0.95));z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML =
    '<div style="background:var(--bg-secondary,#1E293B);border:1px solid var(--bg-tertiary,#334155);border-radius:16px;padding:40px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 48px rgba(0,0,0,0.5);">' +
    '<div style="font-size:42px;margin-bottom:16px;">\u{1F510}</div>' +
    '<h2 style="margin:0 0 8px;font-size:22px;">PHINOX BOS v6</h2>' +
    '<p style="color:var(--text-secondary,#94A3B8);margin:0 0 24px;font-size:14px;">' + t('auth_checking') + '</p>' +
    '<div id="authStatus" style="padding:12px 16px;border-radius:8px;background:var(--bg-primary,#0F172A);font-size:13px;color:var(--text-secondary,#94A3B8);margin-bottom:16px;">' +
    t('auth_connecting') +
    '</div>' +
    '<div style="display:flex;gap:10px;flex-direction:column;">' +
    '<button id="authRetryBtn" class="btn btn-primary" style="display:none;width:100%;" onclick="initAuthSystem()">\u{1F504} ' + t('auth_retry') + '</button>' +
    '<button id="authSkipBtn" class="btn btn-outline" style="display:none;width:100%;color:var(--accent);" onclick="_enterAsGuest()">\u23E9 ' + t('guest_skip') + '</button>' +
    '</div></div>';
  document.body.appendChild(overlay);
}

function hideAuthOverlay() {
  var el = document.getElementById('authOverlay');
  if (el) el.style.display = 'none';
}

function setAuthStatus(msg, isError) {
  var el = document.getElementById('authStatus');
  if (!el) return;
  el.textContent = msg;
  el.style.color = isError ? '#F87171' : 'var(--text-secondary,#94A3B8)';
  el.style.border = isError ? '1px solid #DC2626' : '1px solid var(--bg-tertiary,#334155)';
  var btn = document.getElementById('authRetryBtn');
  if (btn) btn.style.display = isError ? 'inline-flex' : 'none';
}

function _showSkipButton() {
  var btn = document.getElementById('authSkipBtn');
  if (btn) btn.style.display = 'inline-flex';
}

function _enterAsGuest() {
  _currentUser = { email: 'guest', role: 'GUEST', name: 'Guest', permissions: [], member: null };
  _onAuthSuccess(_currentUser);
}

function _onAuthSuccess(user) {
  var displayName = user.name || user.fullName || user.email.split('@')[0];
  var role = user.role || 'User';
  document.getElementById('userName').textContent = displayName;
  document.getElementById('userRole').textContent = role;
  document.getElementById('userAvatar').textContent = (displayName || 'U').charAt(0).toUpperCase();
  var perms = user.permissions || [];
  document.getElementById('userPermissions').textContent = perms.join(', ');
  hideAuthOverlay();
  showToast(t('welcome') + ' ' + displayName + ' (' + role + ')', 'success');
  // Pre-load customers cache
  callServer('uiGetCustomers', { limit: 1000 }).then(function(cres) {
    _customerCache = (cres.data && cres.data.data) || cres.data || [];
  }).catch(function() {});
  navigateTo('dashboard');
}

function initAuthSystem() {
  showAuthOverlay();
  setAuthStatus(t('auth_connecting'), false);

  callServer('uiGetCurrentUser', null).then(function(res) {
    var user = res.data;
    if (!user || !user.email) {
      setAuthStatus(t('auth_failed'), true);
      _authRetryCount++;
      if (_authRetryCount >= 2) _showSkipButton();
      return;
    }
    _currentUser = user;
    _onAuthSuccess(_currentUser);
  }).catch(function(err) {
    console.error('Auth error:', err);
    setAuthStatus('\u274C ' + (err.message || t('auth_error')), true);
    _authRetryCount++;
    if (_authRetryCount >= 2) _showSkipButton();
  });
}

// ─── NOTIFICATION SYSTEM ───
function loadNotifications() {
  _notifications = {
    pendingRegistrations: 0,
    overdueTasks: 0,
    lowStockItems: 0,
    pendingExpenses: 0
  };
  var promises = [];

  if (isAdmin()) {
    promises.push(
      callServer('uiGetPendingRegistrations').then(function(res) {
        var data = (res.data && res.data.data) || res.data || [];
        _notifications.pendingRegistrations = Array.isArray(data) ? data.length : 0;
      }).catch(function() {})
    );
  }

  var today = new Date().toISOString().split('T')[0];
  var monthAgo = new Date(Date.now() - 30*24*60*60*1000).toISOString().split('T')[0];
  promises.push(
    callServer('uiGetTaskStats', monthAgo, today).then(function(res) {
      var stats = res.data || {};
      _notifications.overdueTasks = stats.overdue || 0;
    }).catch(function() {})
  );

  if (isAdmin() || hasPerm('inventory:read')) {
    promises.push(
      callServer('uiGetLowStock').then(function(res) {
        var data = (res.data && res.data.data) || res.data || [];
        _notifications.lowStockItems = Array.isArray(data) ? data.length : 0;
      }).catch(function() {})
    );
  }

  if (isAdmin() || hasPerm('expenses:read')) {
    promises.push(
      callServer('uiGetExpenses', { limit: 1000 }).then(function(res) {
        var all = (res.data && res.data.data) || res.data || [];
        _notifications.pendingExpenses = all.filter(function(e) {
          return (e.status || 'Pending') === 'Pending';
        }).length;
      }).catch(function() {})
    );
  }

  Promise.all(promises).then(function() {
    renderNotifications();
  });
}

function renderNotifications() {
  var bar = document.getElementById('notificationBar');
  if (!bar) return;
  var total = _notifications.pendingRegistrations + _notifications.overdueTasks + _notifications.lowStockItems + _notifications.pendingExpenses;
  if (total === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'block';
  var html = '';
  if (_notifications.pendingRegistrations > 0) {
    html += '<div style="cursor:pointer;padding:8px 16px;border-radius:8px;background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);display:flex;align-items:center;gap:8px;font-size:13px;" onclick="navigateTo(\'members\')">' +
      '<span style="font-size:18px">\u{1F465}</span>' +
      '<span><strong>' + _notifications.pendingRegistrations + '</strong> ' + t('pending_registrations') + '</span></div>';
  }
  if (_notifications.overdueTasks > 0) {
    html += '<div style="cursor:pointer;padding:8px 16px;border-radius:8px;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);display:flex;align-items:center;gap:8px;font-size:13px;" onclick="navigateTo(\'tasks\')">' +
      '<span style="font-size:18px">\u26A0\uFE0F</span>' +
      '<span><strong>' + _notifications.overdueTasks + '</strong> ' + t('overdue_tasks') + '</span></div>';
  }
  if (_notifications.lowStockItems > 0) {
    html += '<div style="cursor:pointer;padding:8px 16px;border-radius:8px;background:rgba(14,165,233,0.15);border:1px solid rgba(14,165,233,0.3);display:flex;align-items:center;gap:8px;font-size:13px;" onclick="navigateTo(\'inventory\')">' +
      '<span style="font-size:18px">\u{1F4E6}</span>' +
      '<span><strong>' + _notifications.lowStockItems + '</strong> ' + t('low_stock_items') + '</span></div>';
  }
  if (_notifications.pendingExpenses > 0) {
    html += '<div style="cursor:pointer;padding:8px 16px;border-radius:8px;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);display:flex;align-items:center;gap:8px;font-size:13px;" onclick="navigateTo(\'approvals\')">' +
      '<span style="font-size:18px">\u{1F9FE}</span>' +
      '<span><strong>' + _notifications.pendingExpenses + '</strong> ' + t('pending_expenses') + '</span></div>';
  }
  document.getElementById('notificationItems').innerHTML = html;
}
