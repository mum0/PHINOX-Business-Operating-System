}

// ─── SERVER BRIDGE (Fixed for GAS V8 — NO .apply()) ───
function callServer(action) {
  var args = Array.prototype.slice.call(arguments, 1);
  console.log('[callServer] >>> ' + action + '(' + (args.length ? JSON.stringify(args).substring(0, 100) : '') + ')');
  return new Promise(function(resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.error('[callServer] google.script.run is NOT available');
      reject(new Error('google.script.run غير متاح — جرب من رابط Web App'));
      return;
    }
    var startedAt = Date.now();
    var runner = google.script.run
      .withSuccessHandler(function(res) {
        var ms = Date.now() - startedAt;
        if (res && typeof res === 'object' && res.success === true && 'data' in res) {
          console.log('[callServer] <<< ' + action + ' OK (' + ms + 'ms)');
          resolve({ data: res.data });
        } else if (res && typeof res === 'object' && res.success === false && res.error) {
          console.error('[callServer] <<< ' + action + ' REJECTED: ' + res.error);
          reject(new Error(res.error));
        } else {
          console.log('[callServer] <<< ' + action + ' LEGACY (' + ms + 'ms)');
          resolve({ data: res });
        }
      })
      .withFailureHandler(function(err) {
        var ms = Date.now() - startedAt;
        var msg = (err && err.message) ? err.message : String(err);
        console.error('[callServer] <<< ' + action + ' ERROR (' + ms + 'ms): ' + msg);
        reject(new Error(msg));
      });
    var fn = runner[action];
    if (typeof fn === 'function') {
      // Direct call — NO .apply() (GAS proxy incompatible with .apply)
      fn(args[0], args[1], args[2], args[3], args[4]);
    } else {
      console.error('[callServer] Function not found: ' + action);
      reject(new Error('Server function "' + action + '" not found'));
    }
  });
}

// ─── XSS ESCAPE ───
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── TOASTS ───
function showToast(message, type) {
  type = type || 'success';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  var icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
  toast.innerHTML = '<span style="font-size:18px">' + icon + '</span><span>' + esc(message) + '</span>';
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(20px)';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

// ─── DATE FORMATTERS ───
function formatDate(dt) {
  if (!dt) return '-';
  var d = new Date(dt);
  if (isNaN(d.getTime())) return String(dt);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}
function formatDateTime(dt) {
  if (!dt) return '-';
  var d = new Date(dt);
  if (isNaN(d.getTime())) return String(dt);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ─── PERMISSIONS ───
function hasPerm(perm) {
  if (!_currentUser || !_currentUser.permissions) return false;
  var perms = _currentUser.permissions;
  if (perms.indexOf('*') > -1 || perms.indexOf('admin') > -1 || perms.indexOf('Admin') > -1) return true;
  return perms.indexOf(perm) > -1;
}
function isAdmin() {
  return hasPerm('admin') || (_currentUser && (_currentUser.role === 'Admin' || _currentUser.role === 'CEO'));
}

function doManualLogin() {
  var emailInput = document.getElementById('manualLoginEmail');
  var passInput = document.getElementById('manualLoginPassword');
  var errorDiv = document.getElementById('authStatus');
  if (!emailInput || !passInput) return;
  var email = emailInput.value.trim();
  var password = passInput.value;
  if (!email || email.indexOf('@') < 0) {
    if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'أدخل إيميل صحيح'; }
    return;
  }
  if (!password || password.length < 1) {
    if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'أدخل كلمة المرور'; }
    return;
  }
  if (errorDiv) errorDiv.style.display = 'none';

  // Check registration status first
  callServer('uiCheckRegistrationStatus', email).then(function(statusRes) {
    var info = statusRes.data || {};
    if (info.exists) {
      if (info.status === 'Pending') {
        showPendingScreen(email);
        return;
      }
      if (info.status === 'Rejected') {
        showRejectedScreen(email);
        return;
      }
    }
    // Try login
    return callServer('uiLoginWithEmail', email, password).then(function(res) {
      var user = res.data;
      if (!user || !user.email) {
        if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'فشل تسجيل الدخول'; }
        return;
      }
      _loginSuccess(user);
    }).catch(function(err) {
      var msg = err.message || 'خطأ في تسجيل الدخول';
      // If "not found" error, offer registration
      if (msg.indexOf('غير موجود') > -1 || msg.indexOf('غير مسجّل') > -1) {
        if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.innerHTML = '⚠️ ' + esc(msg) + '<br><span style="color:#94A3B8;">إذا لم يكن لديك حساب، اضغط "تسجيل كعضو جديد" بالأسفل</span>'; }
      } else {
        if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = msg; }
      }
    });
  }).catch(function(err) {
    if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = err.message || 'خطأ'; }
  });
}

// ─── CHECK & REDIRECT TO REGISTRATION ───
function doCheckAndRegister() {
  var emailInput = document.getElementById('manualLoginEmail');
  var email = emailInput ? emailInput.value.trim() : '';
  if (!email || email.indexOf('@') < 0) {
    showRegistrationForm('', false);
  } else {
    callServer('uiCheckRegistrationStatus', email).then(function(res) {
      var info = res.data || {};
      if (info.exists) {
        if (info.status === 'Pending') {
          showPendingScreen(email);
        } else if (info.status === 'Rejected') {
          showRejectedScreen(email);
        } else {
          showManualLoginForm();
          var errorDiv = document.getElementById('authStatus');
          if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'هذا الإيميل مسجل بالفعل. حاول تسجيل الدخول.'; }
        }
        return;
      }
      var isGmail = info.isGmail || email.indexOf('gmail.com') > -1;
      showRegistrationForm(email, isGmail);
    }).catch(function() {
      showRegistrationForm(email, false);
    });
  }
}

// ─── SUBMIT REGISTRATION ───
function submitRegistration() {
  var errorDiv = document.getElementById('authStatus');
  var name = document.getElementById('regName').value.trim();
  var email = document.getElementById('regEmail').value.trim();
  var phone = document.getElementById('regPhone').value.trim();
  var role = document.getElementById('regRole').value;
  var password = document.getElementById('regPassword') ? document.getElementById('regPassword').value : '';
  var passwordConfirm = document.getElementById('regPasswordConfirm') ? document.getElementById('regPasswordConfirm').value : '';
  var message = document.getElementById('regMessage').value.trim();

  // Validation
  if (!name) { if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'الاسم الكامل مطلوب'; } return; }
  if (!email || email.indexOf('@') < 0) { if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'أدخل إيميل صحيح'; } return; }
  if (!role) { if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'اختر المنصب'; } return; }

  var isGmail = email.indexOf('gmail.com') > -1 || email.indexOf('googlemail.com') > -1;
  if (!isGmail) {
    if (!password || password.length < 4) { if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'كلمة المرور مطلوبة (4 أحرف على الأقل)'; } return; }
    if (password !== passwordConfirm) { if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'كلمتا المرور غير متطابقتين'; } return; }
  }

  if (errorDiv) errorDiv.style.display = 'none';

  callServer('uiRegisterNewMember', {
    fullName: name,
    email: email,
    phone: phone,
    role: role,
    password: password,
    message: message
  }).then(function(res) {
    var data = res.data || {};
    showPendingScreen(email, data.name || name);
  }).catch(function(err) {
    if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = err.message || 'خطأ في التسجيل'; }
  });
}

// ═══════════════════════════════════════════════════════
// BUTTON LOADING EFFECT — prevents double-click
// ═══════════════════════════════════════════════════════
(function() {
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.btn');
    if (!btn || btn.hasAttribute('data-loading')) return;
    // Only apply to action buttons (not nav, tabs, etc.)
    if (btn.classList.contains('nav-item') || btn.classList.contains('tab')) return;
    btn.setAttribute('data-loading', 'true');
    setTimeout(function() { btn.removeAttribute('data-loading'); }, 3000);
  });
})();
</script>
