// ─── SERVER BRIDGE (FIXED: no .apply — direct calls for GAS V8) ───
function callServer(action) {
  return new Promise(function(resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject(new Error('google.script.run ' + t('auth_error')));
      return;
    }
    var runner = google.script.run
      .withSuccessHandler(function(res) {
        if (res && typeof res === 'object' && res.success === true && 'data' in res) {
          resolve({ data: res.data });
        } else if (res && typeof res === 'object' && res.success === false && res.error) {
          reject(new Error(res.error));
        } else {
          resolve({ data: res });
        }
      })
      .withFailureHandler(function(err) {
        var msg = (err && err.message) ? err.message : String(err);
        // google.script.run يرمي هذا الخطأ عند وجود Date/undefined في القيمة المرجعة
        if (msg.indexOf('illegal value in property') !== -1 || msg.indexOf('Failed due to') !== -1) {
          console.info('[callServer] Serialization error in ' + action + ' — will retry if needed');
          reject(new Error('SERVER_SERIALIZATION_ERROR'));
        } else {
          reject(new Error(msg));
        }
      });
    var fn = runner[action];
    if (typeof fn !== 'function') {
      reject(new Error('Server function "' + action + '" not found'));
      return;
    }
    // ✅ FIXED: direct calls بدل fn.apply — يمنع أخطاء GAS V8
    var args = Array.prototype.slice.call(arguments, 1);
    if (args.length === 0) fn();
    else if (args.length === 1) fn(args[0]);
    else if (args.length === 2) fn(args[0], args[1]);
    else if (args.length === 3) fn(args[0], args[1], args[2]);
    else if (args.length === 4) fn(args[0], args[1], args[2], args[3]);
    else if (args.length === 5) fn(args[0], args[1], args[2], args[3], args[4]);
    else fn.apply(runner, args); // fallback نادر
  });
}

// ─── XSS ESCAPE ───
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── TOASTS ───
function showToast(message, type) {
  type = type || 'success';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  var icon = type === 'success' ? '\u2705' : type === 'error' ? '\u274C' : type === 'warning' ? '\u26A0\uFE0F' : '\u2139\uFE0F';
  toast.innerHTML = '<span style="font-size:18px">' + icon + '</span><span>' + esc(message) + '</span>';
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(20px)';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

// ─── MODALS ───
function openModal(id) {
  var el = document.getElementById(id || 'modalGeneric');
  if (el) el.classList.add('active');
}
function closeModal(id) {
  if (id) {
    var el = document.getElementById(id); if (el) el.classList.remove('active');
  } else {
    document.querySelectorAll('.modal-overlay').forEach(function(el) { el.classList.remove('active'); });
  }
}
function openGenericModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalGenericTitle').textContent = title || '';
  document.getElementById('modalGenericBody').innerHTML = bodyHtml || '';
  document.getElementById('modalGenericFooter').innerHTML = footerHtml || '';
  openModal('modalGeneric');
}

// ─── DATE FORMATTERS ───
function formatDate(dt) {
  if (!dt) return '-';
  var d = new Date(dt);
  if (isNaN(d.getTime())) return String(dt);
  var locale = _currentLang === 'ar' ? 'ar-EG' : 'en-US';
  return d.toLocaleDateString(locale, { year: 'numeric', month: 'short', day: 'numeric' });
}
function formatDateTime(dt) {
  if (!dt) return '-';
  var d = new Date(dt);
  if (isNaN(d.getTime())) return String(dt);
  var locale = _currentLang === 'ar' ? 'ar-EG' : 'en-US';
  return d.toLocaleDateString(locale, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ─── PERMISSIONS ───
function hasPerm(perm) {
  if (!_currentUser || !_currentUser.permissions) return false;
  var perms = _currentUser.permissions;
  if (perms.indexOf('*') > -1 || perms.indexOf('admin') > -1 || perms.indexOf('Admin') > -1) return true;
  return perms.indexOf(perm) > -1;
}
function isAdmin() {
  return hasPerm('admin') || (_currentUser && (_currentUser.role === 'Admin' || _currentUser.role === 'CEO'));
}

// ─── LOGOUT ───
function handleLogout() {
  // تدمير الجلسة على السيرفر
  if (_authToken) {
    callServer('uiAuthLogout', _authToken).catch(function() {});
    _authToken = null;
    try { localStorage.removeItem('phinox_session'); } catch(e) {}
  }
  _currentUser = null;
  // إظهار شاشة تسجيل الدخول من جديد
  _showLoginOverlay();
}

  if (!el) return;

  el.classList.add('visible');
}

function _hideAuthError() {
  var el = document.getElementById('authErrorMsg');
  if (el) el.classList.remove('visible');
}

function _showAuthLoading() {
  var form = document.getElementById('authLoginForm');
  var loading = document.getElementById('authLoading');
  if (form) form.style.display = 'none';
  if (loading) loading.classList.add('visible');
}

function _showAuthForm() {
  var form = document.getElementById('authLoginForm');
  var loading = document.getElementById('authLoading');
  if (form) form.style.display = 'block';
  if (loading) loading.classList.remove('visible');
}

/**
 * تسجيل الدخول بالبريد وكلمة المرور
 */
function _doLogin() {
  var emailInput = document.getElementById('authEmailInput');
  var passInput = document.getElementById('authPasswordInput');
  if (!emailInput || !passInput) return;

  var email = emailInput.value.trim();
  var password = passInput.value;

  if (!email || !password) {
    _showAuthError(_currentLang === 'ar' ? 'البريد وكلمة المرور مطلوبان' : 'Email and password required');
    return;
  }

  _hideAuthError();
  _showAuthLoading();

  callServer('uiLoginWithEmail', email, password).then(function(res) {
    var data = res.data;
    if (data && data.token && data.user) {
      _authToken = data.token;
      try { localStorage.setItem('phinox_session', data.token); } catch(e) {}
      _currentUser = data.user;
      _onAuthSuccess(_currentUser);
    } else {
      _showAuthForm();
      _showAuthError(t('auth_failed'));
    }
  }).catch(function(err) {
    _showAuthForm();
    _showAuthError(err.message || t('auth_error'));
  });
}

/**
 * تسجيل الدخول عبر Google
 */
function _doGoogleLogin() {
  _hideAuthError();
  _showAuthLoading();

  callServer('uiLoginWithGoogle').then(function(res) {
    var data = res.data;
    if (data && data.token && data.user) {
      _authToken = data.token;
      try { localStorage.setItem('phinox_session', data.token); } catch(e) {}
      _currentUser = data.user;
      _onAuthSuccess(_currentUser);
    } else {
      _showAuthForm();
      _showAuthError(t('auth_failed'));
    }

// ─── PASSWORD STRENGTH CHECKER ───
function _checkPwdStrength(pwd) {
  var bar = document.getElementById('pwdStrengthBar');
  var txt = document.getElementById('pwdStrengthText');
  if (!bar || !txt) return;
  bar.className = 'pwd-strength-bar';
  if (!pwd || pwd.length < 1) { txt.textContent = ''; return; }
  var score = 0;
  if (pwd.length >= 6) score++;
  if (pwd.length >= 10) score++;
  if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
  if (/[0-9]/.test(pwd)) score++;
  if (/[^a-zA-Z0-9]/.test(pwd)) score++;
  if (score <= 2) {
    bar.classList.add('strength-weak');
    txt.textContent = _currentLang === 'ar' ? 'ضعيفة' : 'Weak';
    txt.style.color = 'var(--danger)';
  } else if (score <= 3) {
    bar.classList.add('strength-medium');
    txt.textContent = _currentLang === 'ar' ? 'متوسطة' : 'Medium';
    txt.style.color = 'var(--warning)';
  } else {
    bar.classList.add('strength-strong');
    txt.textContent = _currentLang === 'ar' ? 'قوية' : 'Strong';
    txt.style.color = 'var(--success)';
  }
}

function submitRegister(event) {

  var status = document.getElementById('registerStatus');
  var submitBtn = document.getElementById('registerSubmitBtn');

  status.style.display = 'block';
  status.style.background = 'rgba(14,165,233,0.1)';
  status.style.border = '1px solid rgba(14,165,233,0.3)';
  status.style.color = '#38BDF8';
  status.textContent = _currentLang === 'ar' ? 'جاري التسجيل...' : 'Registering...';
  if (submitBtn) submitBtn.disabled = true;

  var data = {
    fullName: document.getElementById('regFullName').value.trim(),
    email: document.getElementById('regEmail').value.trim(),
    password: document.getElementById('regPassword').value,
    role: document.getElementById('regRole').value,
    department: document.getElementById('regDepartment').value.trim()
  };

  callServer('uiRegisterMember', data).then(function(res) {
    var result = res.data;
    if (result && result.token && result.user) {
      status.style.background = 'rgba(22,163,74,0.1)';
      status.style.border = '1px solid rgba(22,163,74,0.3)';
      status.style.color = '#4ADE80';
      status.textContent = _currentLang === 'ar' ? 'تم التسجيل بنجاح! جاري تسجيل الدخول...' : 'Registration successful! Signing in...';

      _authToken = result.token;
      try { localStorage.setItem('phinox_session', result.token); } catch(e) {}
      _currentUser = result.user;
      _onAuthSuccess(_currentUser);
    } else {
      _showRegisterError('حدث خطأ غير متوقع');
    }
  }).catch(function(err) {
    _showRegisterError(err.message || 'خطأ غير معروف');
  });

  function _showRegisterError(msg) {
    status.style.background = 'rgba(220,38,38,0.1)';
    status.style.border = '1px solid rgba(220,38,38,0.3)';
    status.style.color = '#F87171';
    status.textContent = msg;
    if (submitBtn) submitBtn.disabled = false;
  }
}

function _onAuthSuccess(user) {

/**
 * تهيئة نظام المصادقة — تُستدعى من DOMContentLoaded
 *
 * المنطق:
 *   1. لو فيه token في localStorage → تحقق من الجلسة
 *   2. لو الجلسة صالحة → دخول مباشر
 *   3. لو لا → حاول Google OAuth كـ fallback
 *   4. لو كل شيء فشل → شاشة تسجيل الدخول
 */
// ✅ قائمة الدوال التي يجب أن توجد في النسخة v6 من UI_Server.js
var _V6_AUTH_FUNCTIONS = ['uiValidateSession','uiLoginWithEmail','uiLoginWithGoogle','uiRegister'];
var _serverHasV6Auth = null; // null = لم نتحقق بعد

/**
 * تحقق مما إذا كان السيرفر يدعم v6 auth (بدون استدعاء فعلي)
 * يُستدعى مرة واحدة فقط
 */
function _checkServerV6Auth() {
  if (_serverHasV6Auth !== null) return _serverHasV6Auth;
  try {
    var runner = google.script.run;
    _serverHasV6Auth = _V6_AUTH_FUNCTIONS.every(function(fnName) {
      return typeof runner[fnName] === 'function';
    });
  } catch(e) {
    _serverHasV6Auth = false;
  }
  return _serverHasV6Auth;
}

function initAuthSystem() {
  // 1. محاولة استعادة الجلسة من localStorage
  var savedToken = null;
  try { savedToken = localStorage.getItem('phinox_session'); } catch(e) {}

  // 2. تحقق مما إذا كان السيرفر يدعم v6 auth
  var hasV6 = _checkServerV6Auth();

  if (savedToken && hasV6) {
    // v6: تحقق من الجلسة عبر token
    callServer('uiValidateSession', savedToken).then(function(res) {
      var user = res.data;
      if (user && user.email) {
        _authToken = savedToken;
        _currentUser = user;
        _onAuthSuccess(_currentUser);
        return;
      }
      // الجلسة غير صالحة
      try { localStorage.removeItem('phinox_session'); } catch(e) {}
      _authToken = null;
      _tryGoogleFallback();
    }).catch(function() {
      try { localStorage.removeItem('phinox_session'); } catch(e) {}
      _authToken = null;
      _tryGoogleFallback();
    });
  } else {
    // لا يوجد token أو السيرفر لا يدعم v6 — حاول Google OAuth مباشرة
    if (savedToken) {
      try { localStorage.removeItem('phinox_session'); } catch(e) {}
      _authToken = null;
    }
    _tryGoogleFallback();
  }
}

/**
 * Fallback: محاولة الدخول عبر Google OAuth (الطريقة القديمة)
 * Step 1: uiPingAuth (خفيفة — بس تجيب الإيميل)
 * Step 2: uiGetCurrentUser (كاملة — بتجيب بيانات العضو)
 */
function _tryGoogleFallback(attempt) {
  attempt = attempt || 0;

  // Step 1: ping خفيف للتأكد إن google.script.run شغال
  callServer('uiPingAuth').then(function(pingRes) {
    var pingEmail = pingRes.data && pingRes.data.email;
    if (!pingEmail) {
      _showLoginOverlay();
      return;
    }
    // Step 2: جيب بيانات العضو الكاملة
    return callServer('uiGetCurrentUser');
  }).then(function(res) {
    if (!res) return; // من Step 1 لو مفيش إيميل
    var user = res.data;
    if (user && user.email) {
      _currentUser = user;
      _onAuthSuccess(_currentUser);
      if (_checkServerV6Auth()) {
        callServer('uiLoginWithGoogle').then(function(sessRes) {
          var sessData = sessRes.data;
          if (sessData && sessData.token) {
            _authToken = sessData.token;
            try { localStorage.setItem('phinox_session', sessData.token); } catch(e) {}
          }
        }).catch(function() {});
      }
    } else {
      _showLoginOverlay();
    }
  }).catch(function(err) {
    if (attempt < 1) {
      console.info('[Auth] Google OAuth attempt ' + (attempt + 1) + ' failed, retrying...');
      setTimeout(function() { _tryGoogleFallback(attempt + 1); }, 800);
      return;
    }
    console.info('[Auth] Google OAuth fallback skipped — showing login form');
    _showLoginOverlay();
  });
}

// ─── MOBILE SIDEBAR TOGGLE ───
function toggleMobileSidebar() {
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  if (!sidebar) return;
  var isOpen = sidebar.classList.contains('open');
  if (isOpen) {
    sidebar.classList.remove('open');
    if (overlay) overlay.classList.remove('active');
  } else {
    sidebar.classList.add('open');
    if (overlay) overlay.classList.add('active');
  }
}

// ─── NAV BADGES (notification counters on sidebar items) ───
function updateNavBadges() {
  function setBadge(id, count) {
    var el = document.getElementById(id);

    if (count > 0) {
      el.textContent = count > 99 ? '99+' : count;
      el.style.display = 'inline-flex';

    }

  setBadge('badge-inventory', _notifications.lowStockItems || 0);
  setBadge('badge-approvals', _notifications.pendingExpenses || 0);
  setBadge('badge-tasks', _notifications.overdueTasks || 0);

}

// ─── NOTIFICATION SYSTEM ───
function loadNotifications() {
  _notifications = { pendingRegistrations: 0, overdueTasks: 0, lowStockItems: 0, pendingExpenses: 0 };
  var promises = [];

  if (isAdmin()) {
    promises.push(
      callServer('uiGetPendingRegistrations').then(function(res) {
        var data = (res.data && res.data.data) || res.data || [];
        _notifications.pendingRegistrations = Array.isArray(data) ? data.length : 0;
      }).catch(function() {})
    );
  }

  var today = new Date().toISOString().split('T')[0];
  var monthAgo = new Date(Date.now() - 30*24*60*60*1000).toISOString().split('T')[0];
  promises.push(
    callServer('uiGetTaskStats', monthAgo, today).then(function(res) {
      var stats = res.data || {};
      _notifications.overdueTasks = stats.overdue || 0;
    }).catch(function() {})
  );

  if (isAdmin() || hasPerm('inventory:read')) {
    promises.push(
      callServer('uiGetLowStock').then(function(res) {
        var data = (res.data && res.data.data) || res.data || [];
        _notifications.lowStockItems = Array.isArray(data) ? data.length : 0;
      }).catch(function() {})
    );
  }

  if (isAdmin() || hasPerm('expenses:read')) {
    promises.push(
      callServer('uiGetExpenses', { limit: 1000 }).then(function(res) {
        var all = (res.data && res.data.data) || res.data || [];
        _notifications.pendingExpenses = all.filter(function(e) {
          return (e.status || 'Pending') === 'Pending';
        }).length;
      }).catch(function() {})
    );
  }

  Promise.all(promises).then(function() { renderNotifications(); updateNavBadges(); });
}

function renderNotifications() {
  var bar = document.getElementById('notificationBar');
  if (!bar) return;
  var total = _notifications.pendingRegistrations + _notifications.overdueTasks + _notifications.lowStockItems + _notifications.pendingExpenses;
  if (total === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  var html = '';
  if (_notifications.pendingRegistrations > 0) {
    html += '<div style="cursor:pointer;padding:8px 16px;border-radius:8px;background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);display:flex;align-items:center;gap:8px;font-size:13px;" onclick="navigateTo(\'members\')">' +
      '<span style="font-size:18px">\u{1F465}</span>' +
      '<span><strong>' + _notifications.pendingRegistrations + '</strong> ' + t('pending_registrations') + '</span></div>';
  }
  if (_notifications.overdueTasks > 0) {
    html += '<div style="cursor:pointer;padding:8px 16px;border-radius:8px;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);display:flex;align-items:center;gap:8px;font-size:13px;" onclick="navigateTo(\'tasks\')">' +
      '<span style="font-size:18px">\u26A0\uFE0F</span>' +
      '<span><strong>' + _notifications.overdueTasks + '</strong> ' + t('overdue_tasks') + '</span></div>';
  }
  if (_notifications.lowStockItems > 0) {
    html += '<div style="cursor:pointer;padding:8px 16px;border-radius:8px;background:rgba(14,165,233,0.15);border:1px solid rgba(14,165,233,0.3);display:flex;align-items:center;gap:8px;font-size:13px;" onclick="navigateTo(\'inventory\')">' +
      '<span style="font-size:18px">\u{1F4E6}</span>' +
      '<span><strong>' + _notifications.lowStockItems + '</strong> ' + t('low_stock_items') + '</span></div>';
  }
  if (_notifications.pendingExpenses > 0) {
    html += '<div style="cursor:pointer;padding:8px 16px;border-radius:8px;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);display:flex;align-items:center;gap:8px;font-size:13px;" onclick="navigateTo(\'approvals\')">' +

      '<span><strong>' + _notifications.pendingExpenses + '</strong> ' + t('pending_expenses') + '</span></div>';
