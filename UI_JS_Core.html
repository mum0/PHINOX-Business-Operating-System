function escAttr(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── SERVER BRIDGE (Fixed for GAS V8 — NO .apply()) ───
function callServer(action) {
  var args = Array.prototype.slice.call(arguments, 1);
  console.log('[callServer] >>> ' + action + '(' + (args.length ? JSON.stringify(args).substring(0, 100) : '') + ')');
  return new Promise(function(resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.error('[callServer] google.script.run is NOT available');
      reject(new Error('google.script.run غير متاح — جرب من رابط Web App'));
      return;
    }
    var startedAt = Date.now();
    var runner = google.script.run
      .withSuccessHandler(function(res) {
        var ms = Date.now() - startedAt;
        if (res && typeof res === 'object' && res.success === true && 'data' in res) {
          console.log('[callServer] <<< ' + action + ' OK (' + ms + 'ms)');
          resolve({ data: res.data });
        } else if (res && typeof res === 'object' && res.success === false && res.error) {
          console.error('[callServer] <<< ' + action + ' REJECTED: ' + res.error);
          reject(new Error(res.error));
        } else {
          console.log('[callServer] <<< ' + action + ' LEGACY (' + ms + 'ms)');
          resolve({ data: res });
        }
      })
      .withFailureHandler(function(err) {
        var ms = Date.now() - startedAt;
        var msg = (err && err.message) ? err.message : String(err);
        console.error('[callServer] <<< ' + action + ' ERROR (' + ms + 'ms): ' + msg);
        reject(new Error(msg));
      });
    var fn = runner[action];
    if (typeof fn === 'function') {
      // Direct call — NO .apply() (GAS proxy incompatible with .apply)
      fn(args[0], args[1], args[2], args[3], args[4]);
    } else {
      console.error('[callServer] Function not found: ' + action);
      reject(new Error('Server function "' + action + '" not found'));
    }
  });
}

// ─── XSS ESCAPE ───
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── TOASTS ───
function showToast(message, type) {
  type = type || 'success';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  var icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
  toast.innerHTML = '<span style="font-size:18px">' + icon + '</span><span>' + esc(message) + '</span>';
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(20px)';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

// ─── MODALS ───
function openModal(id) {
  var el = document.getElementById(id || 'modalGeneric');
  if (el) el.classList.add('active');
}
function closeModal(id) {
  if (id) {
    var el = document.getElementById(id);
    if (el) el.classList.remove('active');
  } else {
    document.querySelectorAll('.modal-overlay').forEach(function(el) { el.classList.remove('active'); });
  }
}
function openGenericModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalGenericTitle').textContent = title || '';
  document.getElementById('modalGenericBody').innerHTML = bodyHtml || '';
  document.getElementById('modalGenericFooter').innerHTML = footerHtml || '';
  openModal('modalGeneric');
}

// ─── DATE FORMATTERS ───
function formatDate(dt) {
  if (!dt) return '-';
  var d = new Date(dt);
  if (isNaN(d.getTime())) return String(dt);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}
function formatDateTime(dt) {
  if (!dt) return '-';
  var d = new Date(dt);
  if (isNaN(d.getTime())) return String(dt);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ─── PERMISSIONS ───
function hasPerm(perm) {
  if (!_currentUser || !_currentUser.permissions) return false;
  var perms = _currentUser.permissions;
  if (perms.indexOf('*') > -1 || perms.indexOf('admin') > -1 || perms.indexOf('Admin') > -1) return true;
  return perms.indexOf(perm) > -1;
}
function isAdmin() {
  return hasPerm('admin') || (_currentUser && (_currentUser.role === 'Admin' || _currentUser.role === 'CEO'));
}

// ═══════════════════════════════════════════════════════
// AUTH & LOGIN OVERLAY
// ═══════════════════════════════════════════════════════
function showAuthOverlay() {
  var existing = document.getElementById('authOverlay');
  if (existing) { existing.style.display = 'flex'; return; }

  var overlay = document.createElement('div');
  overlay.id = 'authOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.95);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML =
    '<div style="background:#1E293B;border:1px solid #334155;border-radius:16px;padding:40px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 48px rgba(0,0,0,0.5);">' +
    '<div style="font-size:42px;margin-bottom:16px;">🔐</div>' +
    '<h2 style="margin:0 0 8px;font-size:22px;">PHINOX BOS v5</h2>' +
    '<p style="color:#94A3B8;margin:0 0 24px;font-size:14px;">جاري التحقق من هويتك...</p>' +
    '<div id="authStatus" style="padding:12px 16px;border-radius:8px;background:#0F172A;font-size:13px;color:#94A3B8;margin-bottom:16px;">' +
    'جاري الاتصال بالسيرفر...' +
    '</div>' +
    '<button id="authRetryBtn" class="btn btn-primary" style="display:none;width:100%;" onclick="initAuthSystem()">🔄 إعادة المحاولة</button>' +
    '</div>';
  document.body.appendChild(overlay);
}

function hideAuthOverlay() {
  var el = document.getElementById('authOverlay');
  if (el) el.style.display = 'none';
}

function setAuthStatus(msg, isError) {
  var el = document.getElementById('authStatus');
  if (!el) return;
  el.textContent = msg;
  el.style.color = isError ? '#F87171' : '#94A3B8';
  el.style.border = isError ? '1px solid #DC2626' : '1px solid #334155';
  var btn = document.getElementById('authRetryBtn');
  if (btn) btn.style.display = isError ? 'inline-flex' : 'none';
}

function initAuthSystem() {
  showAuthOverlay();
  setAuthStatus('جاري التحقق من الجلسة...', false);

  callServer('uiGetCurrentUser', null).then(function(res) {
    var user = res.data;
    if (!user || !user.email) {
      showManualLoginForm();
      return;
    }
    _currentUser = user;
    var displayName = user.name || user.fullName || user.email.split('@')[0];
    var role = user.role || 'User';
    document.getElementById('userName').textContent = displayName;
    document.getElementById('userRole').textContent = role;
    document.getElementById('userAvatar').textContent = (displayName || 'U').charAt(0).toUpperCase();
    var perms = user.permissions || [];
    document.getElementById('userPermissions').textContent = perms.join(', ');
    hideAuthOverlay();
    showToast('مرحباً ' + displayName + ' (' + role + ')', 'success');
    callServer('uiGetCustomers', { limit: 1000 }).then(function(cres) {
      _customerCache = (cres.data && cres.data.data) || cres.data || [];
    }).catch(function() {});
    navigateTo('dashboard');
  }).catch(function(err) {
    console.error('Auth error:', err);
    showManualLoginForm();
  });
}

function showManualLoginForm() {
  var overlay = document.getElementById('authOverlay');
  if (!overlay) return;
  var box = overlay.querySelector('div');
  if (!box) return;
  box.innerHTML =
    '<div style="font-size:42px;margin-bottom:16px;">🔐</div>' +
    '<h2 style="margin:0 0 8px;font-size:22px;">PHINOX BOS v5</h2>' +
    '<p style="color:#94A3B8;margin:0 0 20px;font-size:13px;">تسجيل الدخول اليدوي — أدخل إيميلك وكلمة المرور</p>' +
    '<div style="margin-bottom:14px;text-align:left;">' +
    '<label style="display:block;font-size:13px;color:#94A3B8;margin-bottom:6px;">البريد الإلكتروني *</label>' +
    '<input type="email" id="manualLoginEmail" placeholder="email@example.com" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0F172A;color:#F1F5F9;font-size:14px;box-sizing:border-box;outline:none;" />' +
    '</div>' +
    '<div style="margin-bottom:14px;text-align:left;">' +
    '<label style="display:block;font-size:13px;color:#94A3B8;margin-bottom:6px;">كلمة المرور *</label>' +
    '<input type="password" id="manualLoginPassword" placeholder="••••••••" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0F172A;color:#F1F5F9;font-size:14px;box-sizing:border-box;outline:none;" onkeydown="if(event.key===\'Enter\')doManualLogin()" />' +
    '</div>' +
    '<div id="manualLoginError" style="display:none;padding:8px 12px;border-radius:6px;background:#1C1917;color:#F87171;font-size:12px;margin-bottom:12px;border:1px solid #DC2626;"></div>' +
    '<button class="btn btn-primary" style="width:100%;" onclick="doManualLogin()">🔑 تسجيل الدخول</button>' +
    '<p style="color:#64748B;font-size:11px;margin-top:16px;">يجب أن يكون الإيميل مسجلاً في شيت Members مع كلمة مرور معينة من الأدمن</p>';
}

function doManualLogin() {
  var emailInput = document.getElementById('manualLoginEmail');
  var passInput = document.getElementById('manualLoginPassword');
  var errorDiv = document.getElementById('manualLoginError');
  if (!emailInput || !passInput) return;
  var email = emailInput.value.trim();
  var password = passInput.value;
  if (!email || email.indexOf('@') < 0) {
    if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'أدخل إيميل صحيح'; }
    return;
  }
  if (!password || password.length < 1) {
    if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'أدخل كلمة المرور'; }
    return;
  }
  if (errorDiv) errorDiv.style.display = 'none';
  setAuthStatus('جاري التحقق...', false);

  callServer('uiLoginWithEmail', email, password).then(function(res) {
    var user = res.data;
    if (!user || !user.email) {
      if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'فشل تسجيل الدخول'; }
      return;
    }
    _currentUser = user;
    var displayName = user.name || user.fullName || user.email.split('@')[0];
    var role = user.role || 'User';
    document.getElementById('userName').textContent = displayName;
    document.getElementById('userRole').textContent = role;
    document.getElementById('userAvatar').textContent = (displayName || 'U').charAt(0).toUpperCase();
    var perms = user.permissions || [];
    document.getElementById('userPermissions').textContent = perms.join(', ');
    hideAuthOverlay();
    showToast('مرحباً ' + displayName + ' (' + role + ')', 'success');
    callServer('uiGetCustomers', { limit: 1000 }).then(function(cres) {
      _customerCache = (cres.data && cres.data.data) || cres.data || [];
    }).catch(function() {});
    navigateTo('dashboard');
  }).catch(function(err) {
    if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = err.message || 'خطأ في تسجيل الدخول'; }
  });
}

// ═══════════════════════════════════════════════════════
// BUTTON LOADING EFFECT — prevents double-click
// ═══════════════════════════════════════════════════════
(function() {
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.btn');
    if (!btn || btn.hasAttribute('data-loading')) return;
    // Only apply to action buttons (not nav, tabs, etc.)
    if (btn.classList.contains('nav-item') || btn.classList.contains('tab')) return;
    btn.setAttribute('data-loading', 'true');
    setTimeout(function() { btn.removeAttribute('data-loading'); }, 3000);
  });
})();
</script>
