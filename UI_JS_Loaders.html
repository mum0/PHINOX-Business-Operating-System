<script>
// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function navigateTo(page) {
  // Update active nav-item
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.remove('active');
    if (el.getAttribute('data-page') === page) el.classList.add('active');
  });
  // Show target page section
  document.querySelectorAll('.page-section').forEach(function(el) {
    el.classList.remove('active');
  });
  var target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');
  // Close mobile sidebar
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  if (sidebar && sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
    if (overlay) overlay.classList.remove('active');
  }
  window.scrollTo(0, 0);

  var loaders = {
    dashboard: function() {
      if (typeof loadDashboard === 'function') loadDashboard();
    },
    kpi: function() { loadKPIs(); },
    customers: function() {
      if (typeof loadCustomers === 'function') loadCustomers();
    },
    orders: function() {
      if (typeof loadOrders === 'function') loadOrders();
    },
    sales: function() {
      if (typeof loadSales === 'function') loadSales();
    },
    inventory: loadInventory,
    finance: loadFinance,
    expenses: loadExpenses,
    approvals: loadApprovals,
    tasks: loadTasks,
    marketing: loadMarketing,
    social: loadSocial,
    satisfaction: loadSatisfaction,
    nps: loadNPS,
    members: loadMembers
  };

  if (loaders[page] && typeof loaders[page] === 'function') {
    try {
      loaders[page]();
    } catch (e) {
      console.log('Loader error:', e);
    }
  }
}

// ─── DASHBOARD LOADER ───
function loadDashboard() {
  loadNotifications();
  loadDashboardKpis();
  loadRevenueChart();
  loadRecentOrders();
}

function loadDashboardKpis() {
  callServer('uiGetDashboardKpis').then(function(res) {
    var kpis = (res.data && res.data.data) || res.data || {};
    var items = [
      { label: 'Revenue', value: kpis.revenue || kpis.totalRevenue || 0, format: 'currency' },
      { label: 'Expenses', value: kpis.expenses || kpis.totalExpenses || 0, format: 'currency' },
      { label: 'Profit', value: kpis.profit || kpis.netProfit || 0, format: 'currency' },
      { label: 'Customers', value: kpis.customers || kpis.totalCustomers || 0, format: 'number' },
      { label: 'Inventory Items', value: kpis.inventory || kpis.totalItems || 0, format: 'number' }
    ];
    var html = '';
    items.forEach(function(k) {
      var fmt = k.format === 'currency' ? '$' + Number(k.value).toLocaleString() : Number(k.value).toLocaleString();
      html += '<div class="kpi-card"><div class="kpi-label">' + esc(k.label) + '</div><div class="kpi-value">' + fmt + '</div></div>';
    });
    var c = document.getElementById('dashboardKpis');
    if (c) c.innerHTML = html;
  }).catch(function(err) {
    var c = document.getElementById('dashboardKpis');
    if (c) c.innerHTML = '<div class="kpi-card"><div class="kpi-label">Error</div><div class="kpi-value" style="font-size:14px;">' + esc(err.message) + '</div></div>';
  });
}

// ─── REVENUE CHART ───
function loadRevenueChart() {
  var months = [];
  var labels = [];
  var revenues = [];
  var expenses = [];

  for (var i = 5; i >= 0; i--) {
    var d = new Date();
    d.setMonth(d.getMonth() - i);
    var year = d.getFullYear();
    var month = d.getMonth();
    var firstDay = new Date(year, month, 1).toISOString().split('T')[0];
    var lastDay = new Date(year, month + 1, 0).toISOString().split('T')[0];
    months.push({
      from: firstDay,
      to: lastDay,
      label: d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' })
    });
  }

  var promises = months.map(function(m) {
    return callServer('uiGetFinanceStats', m.from, m.to).then(function(res) {
      var stats = res.data || {};
      var pnl = stats.pnl || {};
      revenues.push(pnl.revenue || 0);
      expenses.push(pnl.expenses || 0);
      labels.push(m.label);
    }).catch(function() {
      revenues.push(0);
      expenses.push(0);
      labels.push(m.label);
    });
  });

  Promise.all(promises).then(function() {
    var canvas = document.getElementById('revenueChartCanvas');
    if (!canvas) return;
    if (_revenueChartInstance) {
      _revenueChartInstance.destroy();
    }
    _revenueChartInstance = new Chart(canvas, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Revenue',
            data: revenues,
            borderColor: '#6366F1',
            backgroundColor: 'rgba(99,102,241,0.1)',
            fill: true,
            tension: 0.4
          },
          {
            label: 'Expenses',
            data: expenses,
            borderColor: '#DC2626',
            backgroundColor: 'rgba(220,38,38,0.1)',
            fill: true,
            tension: 0.4
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: '#94A3B8', font: { size: 12 } }
          }
        },
        scales: {
          x: {
            ticks: { color: '#94A3B8' },
            grid: { color: 'rgba(51,65,85,0.5)' }
          },
          y: {
            ticks: {
              color: '#94A3B8',
              callback: function(v) { return '$' + v.toLocaleString(); }
            },
            grid: { color: 'rgba(51,65,85,0.5)' }
          }
        }
      }
    });
  });
}

// ─── RECENT ORDERS ───
function loadRecentOrders() {
  callServer('uiGetOrders', { limit: 5 }).then(function(res) {
    var list = (res.data && res.data.data) || res.data || [];
    _orderCache = list;
    var container = document.getElementById('recentOrdersTable');
    if (!container) return;
    if (!list.length) {
      container.innerHTML = '<div class="empty-state" style="padding:30px;"><p style="color:var(--text-secondary);">No orders yet</p></div>';
      return;
    }
    var html = '<table class="table"><thead><tr><th>ID</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody>';
    list.forEach(function(o) {
      var status = o.status || 'Pending';
      var badge = status === 'Delivered' ? 'badge-success' : status === 'Cancelled' ? 'badge-danger' : status === 'Shipped' ? 'badge-info' : 'badge-warning';
      html += '<tr><td>' + esc((o.id || '-').substring(0, 12)) + '</td><td>' + esc(o.customerName || o.customer || '-') + '</td><td>$' + esc(String(o.amount || 0)) + '</td><td><span class="badge ' + badge + '">' + esc(status) + '</span></td></tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }).catch(function(err) {
    var container = document.getElementById('recentOrdersTable');
    if (container) container.innerHTML = '<p style="color:#F87171;font-size:13px;">Error: ' + esc(err.message) + '</p>';
  });
}

// ─── KPI PAGE LOADER ───
function loadKPIs() {
  var period = document.getElementById('kpiPeriod') ? document.getElementById('kpiPeriod').value : 'monthly';
  var refDate = document.getElementById('kpiRefDate') ? document.getElementById('kpiRefDate').value : '';
  callServer('uiGetKPIs', { period: period, refDate: refDate }).then(function(res) {
    var kpis = res.data || {};
    var summary = kpis.summary || {};
    var html = '';
    var items = [
      { label: 'Revenue', value: summary.revenue || 0 },
      { label: 'Expenses', value: summary.expenses || 0 },
      { label: 'Profit', value: summary.netProfit || 0 },
      { label: 'Orders', value: kpis.orders || 0 }
    ];
    items.forEach(function(k) {
      html += '<div class="kpi-card"><div class="kpi-label">' + esc(k.label) + '</div><div class="kpi-value">$' + esc(String(k.value)) + '</div></div>';
    });
    var c1 = document.getElementById('kpiContainer');
    if (c1) c1.innerHTML = html;
    var c2 = document.getElementById('dashboardKpis');
    if (c2) c2.innerHTML = html;
  }).catch(function(err) {
    var msg = '<div class="kpi-card"><div class="kpi-label">KPIs</div><div class="kpi-value" style="font-size:14px;">' + esc(err.message) + '</div></div>';
    var c1 = document.getElementById('kpiContainer');
    if (c1) c1.innerHTML = msg;
    var c2 = document.getElementById('dashboardKpis');
    if (c2) c2.innerHTML = msg;
  });
}

// ─── CUSTOMERS ───
function loadCustomers() {
  callServer('uiGetCustomers', { limit: 1000 }).then(function(res) {
    var list = (res.data && res.data.data) || res.data || [];
    _customerCache = list;
    renderCustomers(list);
  }).catch(function(err) {
    document.getElementById('customersTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

function renderCustomers(list) {
  if (!list || !list.length) {
    document.getElementById('customersTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><p>No customers found</p></div>';
    return;
  }
  var html = '<table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  list.forEach(function(c) {
    var cid = c.id || '-';
    var status = c.status || 'Active';
    var badge = status === 'Active' ? 'badge-success' : 'badge-secondary';
    html += '<tr><td>' + esc(c.name || c.fullName || '-') + '</td><td>' + esc(c.email || '-') + '</td><td>' + esc(c.phone || '-') + '</td><td><span class="badge ' + badge + '">' + esc(status) + '</span></td>';
    html += '<td><div class="btn-group"><button class="btn btn-sm btn-outline" data-action="edit-customer" data-id="' + escAttr(cid) + '">Edit</button>';
    if (isAdmin()) html += '<button class="btn btn-sm btn-danger" data-action="delete-customer" data-id="' + escAttr(cid) + '">Delete</button>';
    html += '</div></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('customersTableContainer').innerHTML = html;
}

function filterCustomers() {
  var search = (document.getElementById('customerSearch').value || '').toLowerCase();
  var statusFilter = document.getElementById('customerStatusFilter').value;
  var filtered = _customerCache.filter(function(c) {
    if (search) {
      var match = (c.name || c.fullName || '').toLowerCase().indexOf(search) > -1 ||
                  (c.email || '').toLowerCase().indexOf(search) > -1 ||
                  (c.phone || '').toLowerCase().indexOf(search) > -1;
      if (!match) return false;
    }
    if (statusFilter && (c.status || 'Active') !== statusFilter) return false;
    return true;
  });
  renderCustomers(filtered);
}

function openAddCustomerModal() {
  openGenericModal('Add Customer',
    '<div class="form-group"><label class="form-label">Name *</label><input type="text" class="form-input" id="custName" placeholder="Customer name"></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Email *</label><input type="email" class="form-input" id="custEmail" placeholder="email@example.com"></div>' +
    '<div class="form-group"><label class="form-label">Phone</label><input type="text" class="form-input" id="custPhone" placeholder="Phone number"></div></div>' +
    '<div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea" id="custNotes" rows="2" placeholder="Notes..."></textarea></div>',
    '<button class="btn btn-primary" data-action="submit-add-customer">Create</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitAddCustomer() {
  var data = {
    name: document.getElementById('custName').value,
    email: document.getElementById('custEmail').value,
    phone: document.getElementById('custPhone').value,
    notes: document.getElementById('custNotes').value
  };
  if (!data.name || !data.email) { showToast('Name and email are required', 'error'); return; }
  callServer('uiCreateCustomer', data).then(function() {
    showToast('Customer created successfully');
    closeModal();
    loadCustomers();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function openEditCustomerModal(id) {
  var customer = _customerCache.find(function(c) { return (c.id || '') === id; });
  if (!customer) return;
  openGenericModal('Edit Customer',
    '<div class="form-group"><label class="form-label">Name *</label><input type="text" class="form-input" id="editCustName" value="' + escAttr(customer.name || customer.fullName || '') + '"></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="editCustEmail" value="' + escAttr(customer.email || '') + '"></div>' +
    '<div class="form-group"><label class="form-label">Phone</label><input type="text" class="form-input" id="editCustPhone" value="' + escAttr(customer.phone || '') + '"></div></div>' +
    '<div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea" id="editCustNotes" rows="2">' + esc(customer.notes || '') + '</textarea></div>',
    '<button class="btn btn-primary" data-action="submit-edit-customer" data-id="' + escAttr(id) + '">Update</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitEditCustomer(id) {
  var data = {
    name: document.getElementById('editCustName').value,
    email: document.getElementById('editCustEmail').value,
    phone: document.getElementById('editCustPhone').value,
    notes: document.getElementById('editCustNotes').value
  };
  if (!data.name) { showToast('Name is required', 'error'); return; }
  callServer('uiUpdateCustomer', id, data).then(function() {
    showToast('Customer updated');
    closeModal();
    loadCustomers();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function deleteCustomer(id) {
  if (!confirm('Delete this customer?')) return;
  callServer('uiDeleteCustomer', id).then(function() {
    showToast('Customer deleted');
    loadCustomers();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

// ─── ORDERS ───
function loadOrders() {
  callServer('uiGetOrders', { limit: 1000 }).then(function(res) {
    var list = (res.data && res.data.data) || res.data || [];
    _orderCache = list;
    renderOrders(list);
  }).catch(function(err) {
    document.getElementById('ordersTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

function renderOrders(list) {
  if (!list || !list.length) {
    document.getElementById('ordersTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><p>No orders found</p></div>';
    return;
  }
  var html = '<table class="table"><thead><tr><th>ID</th><th>Date</th><th>Customer</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  list.forEach(function(o) {
    var status = o.status || 'Pending';
    var badge = status === 'Delivered' ? 'badge-success' : status === 'Cancelled' ? 'badge-danger' : status === 'Shipped' ? 'badge-info' : status === 'Confirmed' ? 'badge-primary' : 'badge-warning';
    var oid = o.id || '-';
    html += '<tr><td>' + esc(oid.substring(0, 15)) + '</td><td>' + formatDate(o.date || o.createdAt) + '</td><td>' + esc(o.customerName || o.customer || '-') + '</td><td>$' + esc(String(o.amount || 0)) + '</td><td><span class="badge ' + badge + '">' + esc(status) + '</span></td>';
    html += '<td><select class="form-select" style="font-size:12px;padding:4px 8px;min-width:110px;" onchange="updateOrderStatus(\'' + escAttr(oid) + '\',this.value)">';
    html += '<option value="' + status + '">' + esc(status) + '</option>';
    if (status !== 'Confirmed') html += '<option value="Confirmed">Confirmed</option>';
    if (status !== 'Shipped') html += '<option value="Shipped">Shipped</option>';
    if (status !== 'Delivered') html += '<option value="Delivered">Delivered</option>';
    if (status !== 'Cancelled') html += '<option value="Cancelled">Cancelled</option>';
    html += '</select></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('ordersTableContainer').innerHTML = html;
}

function filterOrders() {
  var statusFilter = document.getElementById('orderStatusFilter').value;
  var from = document.getElementById('orderDateFrom').value;
  var to = document.getElementById('orderDateTo').value;
  var filtered = _orderCache.filter(function(o) {
    if (statusFilter && (o.status || 'Pending') !== statusFilter) return false;
    if (from && (o.date || o.createdAt || '') < from) return false;
    if (to && (o.date || o.createdAt || '') > to) return false;
    return true;
  });
  renderOrders(filtered);
}

function updateOrderStatus(id, newStatus) {
  if (!newStatus || newStatus === '') return;
  callServer('uiUpdateOrderStatus', id, newStatus).then(function() {
    showToast('Order status updated to ' + newStatus);
    loadOrders();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function openAddOrderModal() {
  var custOptions = '<option value="">Select customer...</option>';
  _customerCache.forEach(function(c) {
    custOptions += '<option value="' + escAttr(c.id || '') + '">' + esc(c.name || c.fullName || c.email || '') + '</option>';
  });
  openGenericModal('New Order',
    '<div class="form-group"><label class="form-label">Customer *</label><select class="form-select" id="orderCustomer">' + custOptions + '</select></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Amount *</label><input type="number" step="0.01" class="form-input" id="orderAmount" placeholder="0.00"></div>' +
    '<div class="form-group"><label class="form-label">Notes</label><input type="text" class="form-input" id="orderNotes" placeholder="Order notes"></div></div>',
    '<button class="btn btn-primary" data-action="submit-add-order">Create Order</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitAddOrder() {
  var customerId = document.getElementById('orderCustomer').value;
  var amount = parseFloat(document.getElementById('orderAmount').value) || 0;
  if (!customerId) { showToast('Please select a customer', 'error'); return; }
  if (!amount) { showToast('Amount is required', 'error'); return; }
  var data = {
    customerId: customerId,
    totalAmount: amount,
    notes: document.getElementById('orderNotes').value,
    status: 'Pending'
  };
  callServer('uiCreateOrder', data).then(function() {
    showToast('Order created');
    closeModal();
    loadOrders();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

// ─── SALES ───
function loadSales() {
  callServer('uiGetSales', { limit: 1000 }).then(function(res) {
    var list = (res.data && res.data.data) || res.data || [];
    if (!list.length) {
      document.getElementById('salesTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">💰</div><p>No sales found</p></div>';
      return;
    }
    var html = '<table class="table"><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th></tr></thead><tbody>';
    list.forEach(function(s) {
      html += '<tr><td>' + formatDate(s.date || s.createdAt) + '</td><td>' + esc(s.product || s.productName || '-') + '</td><td>' + esc(String(s.quantity || s.qty || 0)) + '</td><td>$' + esc(String(s.amount || 0)) + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('salesTableContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('salesTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

function openAddSaleModal() {
  openGenericModal('Record Sale',
    '<div class="form-group"><label class="form-label">Product *</label><input type="text" class="form-input" id="saleProduct" placeholder="Product name"></div>' +
    '<div class="form-row"><div class="form-group"><label class="form-label">Quantity *</label><input type="number" class="form-input" id="saleQty" value="1" min="1"></div>' +
    '<div class="form-group"><label class="form-label">Amount *</label><input type="number" step="0.01" class="form-input" id="saleAmount" placeholder="0.00"></div></div>' +
    '<div class="form-group"><label class="form-label">Notes</label><input type="text" class="form-input" id="saleNotes" placeholder="Optional notes"></div>',
    '<button class="btn btn-primary" data-action="submit-add-sale">Record Sale</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
  );
}

function submitAddSale() {
  var data = {
    product: document.getElementById('saleProduct').value,
    quantity: parseInt(document.getElementById('saleQty').value) || 1,
    amount: parseFloat(document.getElementById('saleAmount').value) || 0,
    notes: document.getElementById('saleNotes').value
  };
  if (!data.product || !data.amount) { showToast('Product and amount are required', 'error'); return; }
  callServer('uiCreateSale', data).then(function() {
    showToast('Sale recorded');
    closeModal();
    loadSales();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}
</script>
