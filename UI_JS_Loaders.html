<script>
// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function navigateTo(page) {
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.remove('active');
    if (el.getAttribute('data-page') === page) el.classList.add('active');
  });
  document.querySelectorAll('.page-section').forEach(function(el) { el.classList.remove('active'); });
  var target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0, 0);

  var loaders = {
    dashboard: function() { if (typeof loadDashboard === 'function') loadDashboard(); },
    kpi: function() { if (typeof loadKPIs === 'function') loadKPIs(); },
    customers: function() { if (typeof loadCustomers === 'function') loadCustomers(); },
    orders: function() { if (typeof loadOrders === 'function') loadOrders(); },
    sales: function() { if (typeof loadSales === 'function') loadSales(); },
    inventory: function() { if (typeof loadInventory === 'function') loadInventory(); },
    finance: function() { if (typeof loadFinance === 'function') loadFinance(); },
    expenses: function() { if (typeof loadExpenses === 'function') loadExpenses(); },
    approvals: function() { if (typeof loadApprovals === 'function') loadApprovals(); },
    tasks: function() { if (typeof loadTasks === 'function') loadTasks(); },
    marketing: function() { if (typeof loadMarketing === 'function') loadMarketing(); },
    social: function() { if (typeof loadSocial === 'function') loadSocial(); },
    satisfaction: function() { if (typeof loadSatisfaction === 'function') loadSatisfaction(); },
    nps: function() { if (typeof loadNPS === 'function') loadNPS(); },
    members: function() { if (typeof loadMembers === 'function') loadMembers(); }
  };
  if (loaders[page] && typeof loaders[page] === 'function') {
    try { loaders[page](); } catch (e) { console.log('Loader error:', e); }
  }
}

// ─── DASHBOARD LOADER (Professional v2 — lightweight) ───
function loadDashboard() {
  // Greeting
  var greetEl = document.getElementById('dashboardGreeting');
  var dateEl = document.getElementById('dashboardDate');
  if (greetEl && _currentUser) {
    var name = _currentUser.name || _currentUser.fullName || '';
    var h = new Date().getHours();
    var greeting = h < 12 ? 'صباح الخير' : h < 18 ? 'مساء الخير' : 'مساء الخير';
    greetEl.textContent = greeting + '، ' + name;
  }
  if (dateEl) dateEl.textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  // KPI cards
  var kpiContainer = document.getElementById('dashboardKpis');
  if (kpiContainer) kpiContainer.innerHTML = '<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">' +
    _dashCard('💰', 'الإيرادات', '--', 'revenue') +
    _dashCard('📈', 'المصروفات', '--', 'expenses') +
    _dashCard('📊', 'صافي الربح', '--', 'profit') +
    _dashCard('📦', 'الطلبات', '--', 'orders') +
    _dashCard('🏷️', 'المخزون', '--', 'inventory') +
    _dashCard('👥', 'العملاء', '--', 'customers') +
    '</div>';

  // Load data in parallel
  var p1 = callServer('uiGetDashboardKpis').then(function(res) {
    var d = (res.data && res.data.data) || res.data || {};
    _dashUpdate('revenue', _fmtCurrency(d.revenue || d.totalRevenue || 0));
    _dashUpdate('expenses', _fmtCurrency(d.expenses || d.totalExpenses || 0));
    var profit = d.profit || d.netProfit || 0;
    _dashUpdate('profit', _fmtCurrency(profit));
    _dashUpdate('orders', String(d.orders || 0));
    _dashUpdate('inventory', String(d.inventory || d.totalItems || 0));
    _dashUpdate('customers', String(d.customers || d.totalCustomers || 0));
  }).catch(function() {});

  // Expense breakdown
  var p2 = callServer('uiGetExpenses', { limit: 1000 }).then(function(res) {
    var all = (res.data && res.data.data) || res.data || [];
    var cats = {};
    (all || []).forEach(function(e) {
      var c = e.category || 'Other';
      cats[c] = (cats[c] || 0) + (parseFloat(e.amount) || 0);
    });
    var chartEl = document.getElementById('dashboardExpenseChart');
    if (!chartEl) return;
    var entries = Object.entries(cats).sort(function(a,b){ return b[1]-a[1]; });
    if (!entries.length) { chartEl.innerHTML = '<div style='color:var(--text-secondary);'>لا توجد مصروفات</div>'; return; }
    var total = entries.reduce(function(s,e){ return s+e[1]; }, 0);
    var colors = ['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#06B6D4','#F97316'];
    var maxVal = entries[0][1];
    var bars = entries.slice(0, 6).map(function(e, i) {
      var pct = total > 0 ? ((e[1]/total)*100).toFixed(1) : 0;
      var barW = maxVal > 0 ? Math.max(8, (e[1]/maxVal)*100) : 0;
      return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">' +
        '<div style="width:90px;font-size:12px;color:var(--text-secondary);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(e[0]) + '</div>' +
        '<div style="flex:1;background:var(--bg-secondary);border-radius:6px;height:24px;overflow:hidden;">' +
        '<div style="width:' + barW + '%;height:100%;background:' + colors[i % colors.length] + ';border-radius:6px;transition:width 0.6s ease;"></div></div>' +
        '<div style="width:80px;font-size:12px;font-weight:600;">' + _fmtCurrency(e[1]) + ' <span style="color:var(--text-secondary);font-weight:400;">(' + pct + '%)</span></div></div>';
    }).join('');
    chartEl.innerHTML = bars;
  }).catch(function() {});

  // Recent activity
  var p3 = callServer('uiGetExpenses', { limit: 5 }).then(function(res) {
    var all = (res.data && res.data.data) || res.data || [];
    var actEl = document.getElementById('dashboardRecentActivity');
    if (!actEl) return;
    if (!all || !all.length) { actEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary);">لا يوجد نشاط حديث</div>'; return; }
    var html = '<table class="table" style="margin:0;"><thead><tr><th>الوصف</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>';
    all.slice(0, 5).forEach(function(e) {
      var st = e.status || 'Draft';
      var bc = st==='Approved'?'badge-success':st==='Posted'?'badge-info':st==='Rejected'?'badge-danger':'badge-warning';
      html += '<tr><td>' + esc(e.description || e.category || '-') + '</td><td>' + _fmtCurrency(e.amount||0) + '</td><td><span class="badge ' + bc + '">' + esc(st) + '</span></td></tr>';
    });
    html += '</tbody></table>';
    actEl.innerHTML = html;
  }).catch(function() {});

  Promise.all([p1, p2, p3]).catch(function() {});
}

function _dashCard(icon, label, value, id) {
  return '<div class="card" style="padding:20px;border-left:3px solid var(--accent);position:relative;overflow:hidden;">' +
    '<div style="position:absolute;top:-8px;right:-8px;font-size:48px;opacity:0.08;">' + icon + '</div>' +
    '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">' + label + '</div>' +
    '<div id="dash-' + id + '" style="font-size:24px;font-weight:800;color:var(--text-primary);">' + value + '</div></div>';
}
function _dashUpdate(id, value) {
  var el = document.getElementById('dash-' + id);
  if (el) el.textContent = value;
}
function _fmtCurrency(v) {
  var n = parseFloat(v) || 0;
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

// ─── KPI PAGE LOADER (Simplified — essential only) ───
function loadKPIs() {
  var period = document.getElementById('kpiPeriod') ? document.getElementById('kpiPeriod').value : 'monthly';
  var refDate = document.getElementById('kpiRefDate') ? document.getElementById('kpiRefDate').value : '';
  var c = document.getElementById('kpiContainer');
  if (c) c.innerHTML = '<div class="kpi-grid">' +
    '<div class="card" style="padding:20px;"><div class="kpi-label">الإيرادات</div><div class="kpi-value" id="kpiRev">...</div></div>' +
    '<div class="card" style="padding:20px;"><div class="kpi-label">المصروفات</div><div class="kpi-value" id="kpiExp">...</div></div>' +
    '<div class="card" style="padding:20px;"><div class="kpi-label">صافي الربح</div><div class="kpi-value" id="kpiProf">...</div></div>' +
    '</div>';
  callServer('uiGetKPIs', { period: period, refDate: refDate }).then(function(res) {
    var d = res.data || {};
    var r = document.getElementById('kpiRev'); if(r) r.textContent = _fmtCurrency(d.revenue||0);
    var e = document.getElementById('kpiExp'); if(e) e.textContent = _fmtCurrency(d.expenses||0);
    var p = document.getElementById('kpiProf'); if(p) p.textContent = _fmtCurrency(d.profit||0);
  }).catch(function(err) {
    if (c) c.innerHTML = '<p style="color:var(--text-danger);">' + esc(err.message) + '</p>';
  });
}

function loadCustomers() {
  callServer('uiGetCustomers', { limit: 1000 }).then(function(res) {
    var list = (res.data && res.data.data) || res.data || [];
    if (!list.length) {
      document.getElementById('customersTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><p>No customers found</p></div>';
      return;
    }
    var html = '<table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody>';
    list.forEach(function(c) {
      var status = c.status || 'Active';
      var badge = status === 'Active' ? 'badge-success' : 'badge-secondary';
      html += '<tr><td>' + esc(c.name || c.fullName || '-') + '</td><td>' + esc(c.email || '-') + '</td><td>' + esc(c.phone || '-') + '</td><td><span class="badge ' + badge + '">' + esc(status) + '</span></td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('customersTableContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('customersTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}
function filterCustomers() { loadCustomers(); }
function openAddCustomerModal() { showToast('Add Customer — implement form', 'warning'); }

function loadOrders() {
  callServer('uiGetOrders', { limit: 1000 }).then(function(res) {
    var list = (res.data && res.data.data) || res.data || [];
    if (!list.length) {
      document.getElementById('ordersTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><p>No orders found</p></div>';
      return;
    }
    var html = '<table class="table"><thead><tr><th>ID</th><th>Date</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody>';
    list.forEach(function(o) {
      var status = o.status || 'Pending';
      var badge = status === 'Delivered' ? 'badge-success' : status === 'Cancelled' ? 'badge-danger' : 'badge-warning';
      html += '<tr><td>' + esc(o.id || '-') + '</td><td>' + formatDate(o.date || o.createdAt) + '</td><td>' + esc(o.customerName || o.customer || '-') + '</td><td>$' + esc(String(o.amount || 0)) + '</td><td><span class="badge ' + badge + '">' + esc(status) + '</span></td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('ordersTableContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('ordersTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}
function filterOrders() { loadOrders(); }
function openAddOrderModal() { showToast('Add Order — implement form', 'warning'); }

function loadSales() {
  callServer('uiGetSales', { limit: 1000 }).then(function(res) {
    var list = (res.data && res.data.data) || res.data || [];
    if (!list.length) {
      document.getElementById('salesTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">💰</div><p>No sales found</p></div>';
      return;
    }
    var html = '<table class="table"><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th></tr></thead><tbody>';
    list.forEach(function(s) {
      html += '<tr><td>' + formatDate(s.date || s.createdAt) + '</td><td>' + esc(s.product || s.productName || '-') + '</td><td>' + esc(String(s.quantity || s.qty || 0)) + '</td><td>$' + esc(String(s.amount || 0)) + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('salesTableContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('salesTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}
function openAddSaleModal() { showToast('Add Sale — implement form', 'warning'); }
</script>
