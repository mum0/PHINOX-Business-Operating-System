<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
    body{background:#f5f5f5;padding:20px;direction:rtl;}
    h2{color:#1a237e;margin-bottom:20px;font-size:18px;border-bottom:2px solid #e0e0e0;padding-bottom:10px;}
    .form-group{margin-bottom:15px;}
    label{display:block;font-size:13px;font-weight:700;color:#555;margin-bottom:5px;}
    input{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:#fff;}
    input:focus{outline:none;border-color:#1a237e;}
    .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:25px;}
    .btn{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;}
    .btn-primary{background:#1565C0;color:#fff;}
    .btn-secondary{background:#e0e0e0;color:#333;}
    .toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#37474f;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:9999;}
  </style>
</head>
<body>
  <h2>🏛️ إضافة مساهم جديد</h2>

  <div class="form-group">
    <label>الاسم *</label>
    <input type="text" id="name" placeholder="اسم المساهم">
  </div>

  <div class="form-group">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="email@domain.com">
  </div>

  <div class="form-group">
    <label>عدد الأسهم *</label>
    <input type="number" id="shares" value="1" min="1">
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="google.script.host.close()">إلغاء</button>
    <button class="btn btn-primary" onclick="submitShareholder()">💾 حفظ المساهم</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function showToast(msg, isError){
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = isError ? '#C62828' : '#37474f';
      t.style.display = 'block';
      setTimeout(function(){t.style.display='none';}, 3000);
    }

    function submitShareholder(){
      var name = document.getElementById('name').value.trim();
      var shares = Number(document.getElementById('shares').value);
      if(!name || shares <= 0){ showToast('الاسم وعدد الأسهم مطلوبان', true); return; }

      var btn = document.querySelector('.btn-primary');
      btn.textContent = '⏳ جاري الحفظ...'; btn.disabled = true;

      google.script.run
        .withSuccessHandler(function(res){
          btn.textContent = '💾 حفظ المساهم'; btn.disabled = false;
          if(res && res.success){
            showToast('✅ ' + res.message);
            setTimeout(function(){google.script.host.close();}, 1200);
          } else {
            showToast('❌ ' + (res && res.error ? res.error : 'خطأ'), true);
          }
        })
        .withFailureHandler(function(err){
          btn.textContent = '💾 حفظ المساهم'; btn.disabled = false;
          showToast('❌ ' + err.message, true);
        })
        .addShareholderFromDialog({
          name: name,
          email: document.getElementById('email').value.trim(),
          shares: shares
        });
    }
  </script>
</body>
</html>
