function escAttr(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── SERVER BRIDGE (Fixed for GAS V8 — NO .apply()) ───
function callServer(action) {
  var args = Array.prototype.slice.call(arguments, 1);
  console.log('[callServer] >>> ' + action + '(' + (args.length ? JSON.stringify(args).substring(0, 100) : '') + ')');
  return new Promise(function(resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.error('[callServer] google.script.run is NOT available');
      reject(new Error('google.script.run غير متاح — جرب من رابط Web App'));
      return;
    }
    var startedAt = Date.now();
    var runner = google.script.run
      .withSuccessHandler(function(res) {
        var ms = Date.now() - startedAt;
        if (res && typeof res === 'object' && res.success === true && 'data' in res) {
          console.log('[callServer] <<< ' + action + ' OK (' + ms + 'ms)');
          resolve({ data: res.data });
        } else if (res && typeof res === 'object' && res.success === false && res.error) {
          console.error('[callServer] <<< ' + action + ' REJECTED: ' + res.error);
          reject(new Error(res.error));
        } else {
          console.log('[callServer] <<< ' + action + ' LEGACY (' + ms + 'ms)');
          resolve({ data: res });
        }
      })
      .withFailureHandler(function(err) {
        var ms = Date.now() - startedAt;
        var msg = (err && err.message) ? err.message : String(err);
        console.error('[callServer] <<< ' + action + ' ERROR (' + ms + 'ms): ' + msg);
        reject(new Error(msg));
      });
    var fn = runner[action];
    if (typeof fn === 'function') {
      // Direct call — NO .apply() (GAS proxy incompatible with .apply)
      fn(args[0], args[1], args[2], args[3], args[4]);
    } else {
      console.error('[callServer] Function not found: ' + action);
      reject(new Error('Server function "' + action + '" not found'));
    }
  });
}

// ─── XSS ESCAPE ───
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── TOASTS ───
function showToast(message, type) {
  type = type || 'success';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  var icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
  toast.innerHTML = '<span style="font-size:18px">' + icon + '</span><span>' + esc(message) + '</span>';
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(20px)';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

// ─── MODALS ───
function openModal(id) {
  var el = document.getElementById(id || 'modalGeneric');
  if (el) el.classList.add('active');
}
function closeModal(id) {
  if (id) {
    var el = document.getElementById(id);
    if (el) el.classList.remove('active');
  } else {
    document.querySelectorAll('.modal-overlay').forEach(function(el) { el.classList.remove('active'); });
  }
}
function openGenericModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalGenericTitle').textContent = title || '';
  document.getElementById('modalGenericBody').innerHTML = bodyHtml || '';
  document.getElementById('modalGenericFooter').innerHTML = footerHtml || '';
  openModal('modalGeneric');
}

// ─── DATE FORMATTERS ───
function formatDate(dt) {
  if (!dt) return '-';
  var d = new Date(dt);
  if (isNaN(d.getTime())) return String(dt);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}
function formatDateTime(dt) {
  if (!dt) return '-';
  var d = new Date(dt);
  if (isNaN(d.getTime())) return String(dt);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ─── PERMISSIONS ───
function hasPerm(perm) {
  if (!_currentUser || !_currentUser.permissions) return false;
  var perms = _currentUser.permissions;
  if (perms.indexOf('*') > -1 || perms.indexOf('admin') > -1 || perms.indexOf('Admin') > -1) return true;
  return perms.indexOf(perm) > -1;
}
function isAdmin() {
  return hasPerm('admin') || (_currentUser && (_currentUser.role === 'Admin' || _currentUser.role === 'CEO'));
}

// ═══════════════════════════════════════════════════════
// AUTH & LOGIN OVERLAY
// ═══════════════════════════════════════════════════════
function showAuthOverlay() {
  var existing = document.getElementById('authOverlay');
  if (existing) { existing.style.display = 'flex'; return; }

  var overlay = document.createElement('div');
  overlay.id = 'authOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.95);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML =
    '<div style="background:#1E293B;border:1px solid #334155;border-radius:16px;padding:40px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 48px rgba(0,0,0,0.5);">' +
    '<div style="font-size:42px;margin-bottom:16px;">🔐</div>' +
    '<h2 style="margin:0 0 8px;font-size:22px;">PHINOX BOS v5</h2>' +
    '<p style="color:#94A3B8;margin:0 0 24px;font-size:14px;">جاري التحقق من هويتك...</p>' +
    '<div id="authStatus" style="padding:12px 16px;border-radius:8px;background:#0F172A;font-size:13px;color:#94A3B8;margin-bottom:16px;">' +
    'جاري الاتصال بالسيرفر...' +
    '</div>' +
    '<button id="authRetryBtn" class="btn btn-primary" style="display:none;width:100%;" onclick="initAuthSystem()">🔄 إعادة المحاولة</button>' +
    '</div>';
  document.body.appendChild(overlay);
}

function hideAuthOverlay() {
  var el = document.getElementById('authOverlay');
  if (el) el.style.display = 'none';
}

function setAuthStatus(msg, isError) {
  var el = document.getElementById('authStatus');
  if (!el) return;
  el.textContent = msg;
  el.style.color = isError ? '#F87171' : '#94A3B8';
  el.style.border = isError ? '1px solid #DC2626' : '1px solid #334155';
  var btn = document.getElementById('authRetryBtn');
  if (btn) btn.style.display = isError ? 'inline-flex' : 'none';
}

function initAuthSystem() {
  showAuthOverlay();
  setAuthStatus('جاري التحقق من الجلسة...', false);

  callServer('uiGetCurrentUser', null).then(function(res) {
    var user = res.data;
    if (!user || !user.email) {
      setAuthStatus('❌ المستخدم غير مسجل في النظام. تواصل مع الأدمن.', true);
      return;
    }
    _currentUser = user;
    var displayName = user.name || user.fullName || user.email.split('@')[0];
    var role = user.role || 'User';
    document.getElementById('userName').textContent = displayName;
    document.getElementById('userRole').textContent = role;
    document.getElementById('userAvatar').textContent = (displayName || 'U').charAt(0).toUpperCase();
    var perms = user.permissions || [];
    document.getElementById('userPermissions').textContent = perms.join(', ');
    hideAuthOverlay();
    showToast('مرحباً ' + displayName + ' (' + role + ')', 'success');
    // Pre-load customers cache for NPS/Satisfaction dropdowns
    callServer('uiGetCustomers', { limit: 1000 }).then(function(cres) {
      _customerCache = (cres.data && cres.data.data) || cres.data || [];
    }).catch(function() {});
    navigateTo('dashboard');
  }).catch(function(err) {
    console.error('Auth error:', err);
    setAuthStatus('❌ ' + (err.message || 'خطأ في الاتصال بالسيرفر'), true);
    var btn = document.getElementById('authRetryBtn');
    if (btn) {
      btn.style.display = 'inline-flex';
      btn.textContent = '🔄 إعادة المحاولة';
    }
  });
}

// NAVIGATION
// ═══════════════════════════════════════════════════════
function navigateTo(page) {
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.remove('active');
    if (el.getAttribute('data-page') === page) el.classList.add('active');
  });
  document.querySelectorAll('.page-section').forEach(function(el) { el.classList.remove('active'); });
  var target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0, 0);

  var loaders = {
    dashboard: function() { if (typeof loadDashboard === 'function') loadDashboard(); },
    kpi: function() { if (typeof loadKPIs === 'function') loadKPIs(); },
    customers: function() { if (typeof loadCustomers === 'function') loadCustomers(); },
    orders: function() { if (typeof loadOrders === 'function') loadOrders(); },
    sales: function() { if (typeof loadSales === 'function') loadSales(); },
    inventory: function() { if (typeof loadInventory === 'function') loadInventory(); },
    finance: function() { if (typeof loadFinance === 'function') loadFinance(); },
    expenses: function() { if (typeof loadExpenses === 'function') loadExpenses(); },
    approvals: function() { if (typeof loadApprovals === 'function') loadApprovals(); },
    tasks: function() { if (typeof loadTasks === 'function') loadTasks(); },
    marketing: function() { if (typeof loadMarketing === 'function') loadMarketing(); },
    social: function() { if (typeof loadSocial === 'function') loadSocial(); },
    satisfaction: function() { if (typeof loadSatisfaction === 'function') loadSatisfaction(); },
    nps: function() { if (typeof loadNPS === 'function') loadNPS(); },
    members: function() { if (typeof loadMembers === 'function') loadMembers(); }
  };
  if (loaders[page] && typeof loaders[page] === 'function') {
    try { loaders[page](); } catch (e) { console.log('Loader error:', e); }
  }
}

// ─── DASHBOARD LOADER ───
function loadDashboard() {
  callServer('uiGetDashboardKpis').then(function(res) {
    var kpis = (res.data && res.data.data) || res.data || {};
    var items = [
      { label: 'Revenue', value: kpis.revenue || kpis.totalRevenue || 0, format: 'currency' },
      { label: 'Expenses', value: kpis.expenses || kpis.totalExpenses || 0, format: 'currency' },
      { label: 'Profit', value: kpis.profit || kpis.netProfit || 0, format: 'currency' },
      { label: 'Customers', value: kpis.customers || kpis.totalCustomers || 0, format: 'number' },
      { label: 'Inventory Items', value: kpis.inventory || kpis.totalItems || 0, format: 'number' }
    ];
    var html = '';
    items.forEach(function(k) {
      var fmt = k.format === 'currency' ? '$' + Number(k.value).toLocaleString() : Number(k.value).toLocaleString();
      html += '<div class="kpi-card"><div class="kpi-label">' + esc(k.label) + '</div><div class="kpi-value">' + fmt + '</div></div>';
    });
    var c = document.getElementById('dashboardKpis');
    if (c) c.innerHTML = html;
  }).catch(function(err) {
    var c = document.getElementById('dashboardKpis');
    if (c) c.innerHTML = '<div class="kpi-card"><div class="kpi-label">Error</div><div class="kpi-value" style="font-size:14px;">' + esc(err.message) + '</div></div>';
  });
}

    var html = '<table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody>';
    list.forEach(function(c) {
      var status = c.status || 'Active';
      var badge = status === 'Active' ? 'badge-success' : 'badge-secondary';
      html += '<tr><td>' + esc(c.name || c.fullName || '-') + '</td><td>' + esc(c.email || '-') + '</td><td>' + esc(c.phone || '-') + '</td><td><span class="badge ' + badge + '">' + esc(status) + '</span></td></tr>';

    html += '</tbody></table>';
    document.getElementById('customersTableContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('customersTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';

// ═══════════════════════════════════════════════════════
// INVENTORY — BOM hidden unless inventory:bom_read
// ═══════════════════════════════════════════════════════
function loadInventory() {
  callServer('uiGetInventory', { limit: 1000 }).then(function(res) {
    var raw = (res.data && res.data.data) || res.data;
    _inventoryCache = Array.isArray(raw) ? raw : (Array.isArray(raw && raw.items) ? raw.items : []);
    renderInventory(_inventoryCache);
    populateCategoryFilter();
  }).catch(function(err) {
    document.getElementById('inventoryTableContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

function renderInventory(list) {
  if (!Array.isArray(list) || !list.length) {
    document.getElementById('inventoryTableContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🏭</div><p>No inventory items</p></div>';
    return;
  }
  var html = '<table class="table"><thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Qty</th><th>Cost</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  list.forEach(function(item) {
    var qty = item.quantity || item.qty || 0;
    var minStock = item.minStock || item.min_stock || 0;
    var status = qty <= 0 ? 'Out of Stock' : (minStock > 0 && qty <= minStock) ? 'Low Stock' : 'In Stock';
    var badgeClass = status === 'In Stock' ? 'badge-success' : status === 'Low Stock' ? 'badge-warning' : 'badge-danger';
    html += '<tr><td>' + esc(item.sku || item.id || '-') + '</td><td>' + esc(item.name || '-') + '</td><td>' + esc(item.category || '-') + '</td>';
    html += '<td>' + esc(String(qty)) + '</td><td>$' + esc(String(item.cost || 0)) + '</td>';
    html += '<td><span class="badge ' + badgeClass + '">' + esc(status) + '</span></td>';
    html += '<td><div class="btn-group">';
    html += '<button class="btn btn-sm btn-outline" data-action="open-restock" data-sku="' + escAttr(item.sku || item.id) + '" data-name="' + escAttr(item.name || '') + '" data-qty="' + escAttr(String(qty)) + '">📥 Restock</button>';
    html += '<button class="btn btn-sm btn-outline" data-action="open-movements" data-sku="' + escAttr(item.sku || item.id) + '" data-name="' + escAttr(item.name || '') + '">📦 Movements</button>';
    // BOM buttons hidden unless has inventory:bom_read permission
    if (hasPerm('inventory:bom_read')) {
      html += '<button class="btn btn-sm btn-outline" data-action="open-bom" data-sku="' + escAttr(item.sku || item.id) + '" data-name="' + escAttr(item.name || '') + '">📋 BOM</button>';
      html += '<button class="btn btn-sm btn-outline" data-action="open-cost-margin" data-sku="' + escAttr(item.sku || item.id) + '" data-name="' + escAttr(item.name || '') + '">💰 Cost</button>';
    }
    html += '</div></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('inventoryTableContainer').innerHTML = html;
}

function populateCategoryFilter() {
  var cats = {};
  _inventoryCache.forEach(function(item) {
    if (item.category) cats[item.category] = true;
  });
  var select = document.getElementById('inventoryCategoryFilter');
  var current = select.value;
  select.innerHTML = '<option value="">All Categories</option>';
  Object.keys(cats).sort().forEach(function(c) {
    select.innerHTML += '<option value="' + esc(c) + '">' + esc(c) + '</option>';
  });
  select.value = current;
}

function filterInventory() {
  var search = (document.getElementById('inventorySearch').value || '').toLowerCase();
  var cat = document.getElementById('inventoryCategoryFilter').value;
  var statusFilter = document.getElementById('inventoryStatusFilter').value;
  var filtered = _inventoryCache.filter(function(item) {
    var qty = item.quantity || item.qty || 0;
    var minStock = item.minStock || item.min_stock || 0;
    var status = qty <= 0 ? 'Out of Stock' : (minStock > 0 && qty <= minStock) ? 'Low Stock' : 'In Stock';
    var matchSearch = !search || ((item.sku || '') + ' ' + (item.name || '') + ' ' + (item.category || '')).toLowerCase().indexOf(search) > -1;
    var matchCat = !cat || item.category === cat;
    var matchStatus = !statusFilter || status === statusFilter;
    return matchSearch && matchCat && matchStatus;
  });
  renderInventory(filtered);
}

function showLowStock() {
  var filtered = _inventoryCache.filter(function(item) {
    var qty = item.quantity || item.qty || 0;
    var minStock = item.minStock || item.min_stock || 0;
    return minStock > 0 && qty <= minStock && qty > 0;
  });
  renderInventory(filtered);
  showToast('Showing ' + filtered.length + ' low stock items', 'warning');
}

function showOutOfStock() {
  var filtered = _inventoryCache.filter(function(item) {
    return (item.quantity || item.qty || 0) <= 0;
  });
  renderInventory(filtered);
  showToast('Showing ' + filtered.length + ' out of stock items', 'error');
}

function openAddInventoryModal() {
  openGenericModal('Add Inventory Item',

  var unit = document.getElementById('bomComponentUnit').value || 'pcs';
  if (!sku || qty <= 0) { showToast('Select a component and enter quantity', 'error'); return; }
  _bomComponents.push({ componentSku: sku, qty: qty, unit: unit });
  renderBOMComponents();
  document.getElementById('bomComponentSelect').value = '';
  document.getElementById('bomComponentQty').value = '1';

function removeBOMComponent(idx) {
  _bomComponents.splice(idx, 1);
  renderBOMComponents();
}

function saveBOM() {
  var sku = document.getElementById('bomEditSku').value;
  var notes = document.getElementById('bomEditNotes').value;
  if (!sku) { showToast('SKU required', 'error'); return; }
  
  // Step 1: Create BOM without components
  callServer('uiCreateBOM', { sku: sku, notes: notes }).then(function(res) {
    var bom = res.data;
    if (!bom || !bom.id) throw new Error('Failed to create BOM');
    
    // Step 2: Add components one by one
    var promises = _bomComponents.map(function(c) {
      return callServer('uiAddBOMItem', bom.id, { componentSku: c.componentSku, quantity: c.qty, unit: c.unit });
    });
    
    return Promise.all(promises);
  }).then(function() {
    showToast('BOM saved successfully');
    closeModal('modalBOMEditor');
    loadInventory();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}

function openCostMarginModal(sku, name) {
  document.getElementById('costProductLabel').textContent = esc(name) + ' (' + esc(sku) + ')';
  document.getElementById('costProductId').value = sku;
  document.getElementById('costManualPrice').value = '';

  openModal('modalCostMargin');

function calculateCostMargin() {
  var sku = document.getElementById('costProductId').value;
  var price = document.getElementById('costManualPrice').value;
  callServer('uiCalculateCost', sku).then(function(costRes) {
    var cost = costRes.data.finalCost || 0;
    var sellingPrice = parseFloat(price) || 0;
    if (!sellingPrice) {
      // Try to get price from inventory cache
      var item = _inventoryCache.find(function(i) { return i.sku === sku; });
      sellingPrice = item ? (item.price || item.sellingPrice || 0) : 0;
    }
    var margin = sellingPrice > 0 ? ((sellingPrice - cost) / sellingPrice * 100) : 0;
    var html = '<div class="grid-3"><div class="kpi-card"><div class="kpi-label">BOM Cost</div><div class="kpi-value">$' + esc(String(costRes.data.bomCost || 0)) + '</div></div>';
    html += '<div class="kpi-card"><div class="kpi-label">Inventory Cost</div><div class="kpi-value">$' + esc(String(costRes.data.inventoryCost || 0)) + '</div></div>';
    html += '<div class="kpi-card"><div class="kpi-label">Final Cost</div><div class="kpi-value">$' + esc(String(cost)) + '</div></div></div>';
    html += '<div style="margin-top:16px;padding:16px;background:var(--bg-primary);border-radius:8px;">';
    html += '<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span>Selling Price:</span><strong>$' + esc(String(sellingPrice)) + '</strong></div>';
    html += '<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span>Cost:</span><strong>$' + esc(String(cost)) + '</strong></div>';
    html += '<div style="display:flex;justify-content:space-between;"><span>Margin:</span><strong class="' + (margin >= 30 ? 'text-success' : margin >= 10 ? 'text-warning' : 'text-danger') + '">' + esc(String(margin.toFixed(2))) + '%</strong></div>';
    html += '</div>';
    document.getElementById('costResultContainer').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('costResultContainer').innerHTML = '<p class="text-danger">Error: ' + esc(err.message) + '</p>';
  });
}

    var stats = res.data || {};

  });

  var html = '<table class="table"><thead><tr><th>ID</th><th>Date</th><th>Category</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  filtered.forEach(function(e) {
    var status = e.status || 'Pending';
    var badgeClass = status === 'Approved' ? 'badge-success' : status === 'Rejected' ? 'badge-danger' : status === 'Posted' ? 'badge-info' : 'badge-warning';
    html += '<tr><td>' + esc(e.id || '-') + '</td><td>' + formatDate(e.date || e.createdAt) + '</td><td>' + esc(e.category || '-') + '</td>';

      html += '<button class="btn btn-sm btn-success" data-action="approve-expense" data-id="' + escAttr(e.id) + '">Approve</button>';
      html += '<button class="btn btn-sm btn-danger" data-action="open-reject-expense" data-id="' + escAttr(e.id) + '">Reject</button>';

      html += '<button class="btn btn-sm btn-primary" data-action="open-post-expense" data-id="' + escAttr(e.id) + '">Post</button>';

      html += '<button class="btn btn-sm btn-danger" data-action="delete-expense" data-id="' + escAttr(e.id) + '">Delete</button>';
    }
    html += '</div></td></tr>';

  html += '</tbody></table>';
  document.getElementById('expensesTableContainer').innerHTML = html;
}

function updateRoleWarning() {
  var role = document.getElementById('memRole').value;
  var container = document.getElementById('roleWarningContainer');
  var adminCount = 0, ceoCount = 0;
  _memberCache.forEach(function(m) {
    var r = String(m.role || (Array.isArray(m) ? m[2] : undefined) || '').trim();
    if (r === 'Admin') adminCount++;
    if (r === 'CEO') ceoCount++;
  });
  
  var msg = '';
  if (role === 'Admin' && adminCount >= 1) {
    msg = '<div class="role-note danger">❌ Cannot add: Only 1 Admin allowed (' + adminCount + '/1)</div>';
  } else if (role === 'CEO' && ceoCount >= 1) {
    msg = '<div class="role-note danger">❌ Cannot add: Only 1 CEO allowed (' + ceoCount + '/1)</div>';
  } else if (role === 'Admin') {
    msg = '<div class="role-note">✅ Admin slot available</div>';
  } else if (role === 'CEO') {
    msg = '<div class="role-note">✅ CEO slot available</div>';
  }
  container.innerHTML = msg;
}

  var adminCount = 0, ceoCount = 0;
  _memberCache.forEach(function(m) {
    var r = String(m.role || (Array.isArray(m) ? m[2] : undefined) || '').trim();
    if (r === 'Admin') adminCount++;
    if (r === 'CEO') ceoCount++;
  });
  if (data.role === 'Admin' && adminCount >= 1) { showToast('Only one Admin is allowed', 'error'); return; }
  if (data.role === 'CEO' && ceoCount >= 1) { showToast('Only one CEO is allowed', 'error'); return; }
  
  callServer('uiAddMember', data).then(function() {
    showToast('Member added successfully');
    closeModal();
    loadMembers();
  }).catch(function(err) {
    showToast('Error: ' + err.message, 'error');
  });
}
