<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>PHINOX Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root{--primary:#1a237e;--primary-light:#e8eaf6;--success:#2E7D32;--warning:#E65100;--danger:#C62828;--info:#1565C0;--header:#37474f;--bg:#f5f5f5;--card:#fff;--text:#212121;}
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
    body{background:var(--bg);color:var(--text);}
    .header{background:var(--primary);color:#fff;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;}
    .header h1{font-size:20px;}
    .header-actions{display:flex;gap:10px;}
    .btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.2s;}
    .btn:hover{opacity:.85;transform:translateY(-1px);}
    .btn-primary{background:#fff;color:var(--primary);}
    .btn-success{background:var(--success);color:#fff;}
    .btn-info{background:var(--info);color:#fff;}
    .btn-warning{background:var(--warning);color:#fff;}
    .btn-danger{background:var(--danger);color:#fff;}
    
    .container{padding:20px;}
    .toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
    
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:25px;}
    .card{background:var(--card);border-radius:10px;padding:18px;box-shadow:0 2px 6px rgba(0,0,0,.08);border-right:4px solid var(--info);position:relative;}
    .card.success{border-right-color:var(--success);} .card.warning{border-right-color:var(--warning);} .card.danger{border-right-color:var(--danger);}
    .card-icon{position:absolute;left:15px;top:15px;font-size:28px;opacity:.15;}
    .card h3{font-size:12px;color:#666;margin-bottom:6px;}
    .card .value{font-size:26px;font-weight:700;}
    
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
    @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
    
    .section{background:var(--card);border-radius:10px;padding:20px;box-shadow:0 2px 6px rgba(0,0,0,.08);margin-bottom:20px;}
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
    .section h2{font-size:16px;color:var(--primary);}
    
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{background:var(--header);color:#fff;padding:10px;text-align:right;}
    td{padding:10px;border-bottom:1px solid #e0e0e0;}
    tr:hover{background:#f8f9fa;}
    
    .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
    .badge-green{background:#e6f4ea;color:var(--success);} .badge-red{background:#fce8e6;color:var(--danger);}
    .badge-yellow{background:#fef3e8;color:#b06000;} .badge-blue{background:#e8f0fe;color:var(--info);}
    
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--header);color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;z-index:9999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2);}
    .toast.show{display:block;animation:fadeIn .3s;}
    @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
    
    .loading{text-align:center;padding:30px;color:#999;}
    .spinner{display:inline-block;width:20px;height:20px;border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite;}
    @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  </style>
</head>
<body>

<div class="header">
  <h1><i class="fas fa-bolt"></i> PHINOX <span style="font-size:14px;opacity:.8">لوحة التحكم</span></h1>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="refreshAll()"><i class="fas fa-sync-alt"></i> تحديث</button>
    <button class="btn btn-success" onclick="openTaskDialog()"><i class="fas fa-plus"></i> مهمة</button>
    <button class="btn btn-info" onclick="openMemberDialog()"><i class="fas fa-user-plus"></i> عضو</button>
    <button class="btn btn-warning" onclick="openProductDialog()"><i class="fas fa-box"></i> منتج</button>
    <button class="btn btn-success" onclick="openOrderDialog()"><i class="fas fa-shopping-cart"></i> طلب</button>
  </div>
</div>

<div class="container">
  
  <!-- Cards -->
  <div class="cards" id="cardsArea">
    <div class="loading"><div class="spinner"></div> جاري التحميل...</div>
  </div>
  
  <div class="grid-2">
    <!-- Top Members -->
    <div class="section">
      <div class="section-header"><h2><i class="fas fa-trophy"></i> أفضل الأعضاء</h2></div>
      <div id="topMembersArea"><div class="loading">جاري التحميل...</div></div>
    </div>
    
    <!-- Tasks Summary -->
    <div class="section">
      <div class="section-header"><h2><i class="fas fa-tasks"></i> ملخص المهام</h2></div>
      <div id="tasksArea"><div class="loading">جاري التحميل...</div></div>
    </div>
  </div>
  
  <div class="grid-2">
    <!-- Inventory -->
    <div class="section">
      <div class="section-header"><h2><i class="fas fa-warehouse"></i> المخزون</h2></div>
      <div id="inventoryArea"><div class="loading">جاري التحميل...</div></div>
    </div>
    
    <!-- Finance -->
    <div class="section">
      <div class="section-header"><h2><i class="fas fa-chart-line"></i> المالية</h2></div>
      <div id="financeArea"><div class="loading">جاري التحميل...</div></div>
    </div>
  </div>
  
  <!-- Orders -->
  <div class="section">
    <div class="section-header"><h2><i class="fas fa-shopping-bag"></i> طلبات العملاء</h2></div>
    <div id="ordersArea"><div class="loading">جاري التحميل...</div></div>
  </div>
  
</div>

<div class="toast" id="toast"></div>

<script>
// ── Toast ──
function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type==='error' ? 'var(--danger)' : 'var(--header)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// ── Load Dashboard ──
function loadDashboard(){
  google.script.run
    .withSuccessHandler(renderDashboard)
    .withFailureHandler(err => { showToast('خطأ: ' + err.message, 'error'); })
    .getDashboardData();
}

function renderDashboard(data){
  // Cards
  const cardsHtml = `
    <div class="card"><i class="fas fa-users card-icon"></i><h3>الأعضاء</h3><div class="value">${data.cards.members}</div></div>
    <div class="card"><i class="fas fa-tasks card-icon"></i><h3>المهام</h3><div class="value">${data.cards.tasks}</div></div>
    <div class="card success"><i class="fas fa-check-circle card-icon"></i><h3>المنجزة</h3><div class="value">${data.cards.completed}</div></div>
    <div class="card danger"><i class="fas fa-exclamation-triangle card-icon"></i><h3>المتأخرة</h3><div class="value">${data.cards.late}</div></div>
    <div class="card"><i class="fas fa-chart-pie card-icon"></i><h3>متوسط KPI</h3><div class="value">${data.cards.kpi}</div></div>
    <div class="card success"><i class="fas fa-percentage card-icon"></i><h3>الإنتاجية</h3><div class="value">${data.cards.productivity}%</div></div>
  `;
  document.getElementById('cardsArea').innerHTML = cardsHtml;
  
  // Top Members
  let tmHtml = '<table><tr><th>العضو</th><th>KPI</th><th>إنتاجية</th><th>التقدير</th></tr>';
  data.topMembers.forEach(m => {
    tmHtml += `<tr><td>${m.name}</td><td>${m.kpi}</td><td>${m.productivity}%</td><td><span class="badge badge-green">${m.grade}</span></td></tr>`;
  });
  document.getElementById('topMembersArea').innerHTML = tmHtml + '</table>';
  
  // Tasks
  document.getElementById('tasksArea').innerHTML = `
    <table>
      <tr><th>المقياس</th><th>القيمة</th></tr>
      <tr><td>بانتظار المراجعة</td><td>${data.tasksSummary.pending}</td></tr>
      <tr><td>قيد التنفيذ</td><td>${data.tasksSummary.active}</td></tr>
      <tr><td>المنجزة</td><td>${data.tasksSummary.completed}</td></tr>
      <tr><td>المتأخرة</td><td><span class="badge badge-red">${data.tasksSummary.late}</span></td></tr>
      <tr><td>متوسط الدرجة</td><td>${data.tasksSummary.avgScore}</td></tr>
    </table>
  `;
  
  // Inventory
  document.getElementById('inventoryArea').innerHTML = `
    <table>
      <tr><th>المقياس</th><th>القيمة</th></tr>
      <tr><td>إجمالي المنتجات</td><td>${data.inventory.totalProducts}</td></tr>
      <tr><td>الكمية الإجمالية</td><td>${data.inventory.totalQuantity}</td></tr>
      <tr><td>القيمة</td><td>${data.inventory.totalValue} ج.م</td></tr>
      <tr><td>منخفض المخزون</td><td><span class="badge badge-yellow">${data.inventory.lowStock}</span></td></tr>
      <tr><td>نفذ من المخزون</td><td><span class="badge badge-red">${data.inventory.outOfStock}</span></td></tr>
    </table>
  `;
  
  // Finance
  document.getElementById('financeArea').innerHTML = `
    <table>
      <tr><th>المقياس</th><th>القيمة</th></tr>
      <tr><td>الرصيد الحالي</td><td><strong>${data.finance.currentBalance} ج.م</strong></td></tr>
      <tr><td>إيرادات الشهر</td><td class="text-success">${data.finance.monthlyIncome} ج.م</td></tr>
      <tr><td>مصروفات الشهر</td><td class="text-danger">${data.finance.monthlyExpense} ج.م</td></tr>
      <tr><td>ربح الشهر</td><td><span class="badge ${data.finance.monthlyProfit>=0?'badge-green':'badge-red'}">${data.finance.monthlyProfit} ج.م</span></td></tr>
    </table>
  `;
  
  // Orders
  document.getElementById('ordersArea').innerHTML = `
    <table>
      <tr><th>المقياس</th><th>القيمة</th></tr>
      <tr><td>إجمالي الطلبات</td><td>${data.orders.totalOrders}</td></tr>
      <tr><td>الإيرادات</td><td>${data.orders.revenue} ج.م</td></tr>
      <tr><td>متوسط قيمة الطلب</td><td>${data.orders.averageValue} ج.م</td></tr>
      <tr><td>نسبة التحويل</td><td>${data.orders.conversionRate}%</td></tr>
      <tr><td>نسبة الإرجاع</td><td><span class="badge badge-yellow">${data.orders.returnRate}%</span></td></tr>
    </table>
  `;
}

// ── Refresh ──
function refreshAll(){
  const btn = event.target;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
  google.script.run
    .withSuccessHandler(res => {
      btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
      if(res.success){
        showToast(res.message);
        loadDashboard();
      }else{
        showToast(res.error, 'error');
      }
    })
    .withFailureHandler(err => {
      btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
      showToast(err.message, 'error');
    })
    .refreshSystemFromUI();
}

// ── Open Dialogs (Functional) ──
function openTaskDialog(){
  google.script.run.openTaskDialogServer();
}
function openMemberDialog(){
  google.script.run.openMemberDialogServer();
}
function openProductDialog(){
  google.script.run.openProductDialogServer();
}
function openOrderDialog(){
  google.script.run.openOrderDialogServer();
}
// ── Init ──
loadDashboard();
</script>
</body>
</html>
