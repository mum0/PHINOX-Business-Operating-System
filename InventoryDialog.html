<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
    body{background:#f5f5f5;padding:20px;direction:rtl;}
    h2{color:#1a237e;margin-bottom:20px;font-size:18px;border-bottom:2px solid #e0e0e0;padding-bottom:10px;}
    .form-row{display:flex;gap:15px;}
    .form-row .form-group{flex:1;}
    .form-group{margin-bottom:15px;}
    label{display:block;font-size:13px;font-weight:700;color:#555;margin-bottom:5px;}
    input,select{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:#fff;}
    input:focus,select:focus{outline:none;border-color:#1a237e;}
    .error{color:#C62828;font-size:12px;margin-top:4px;display:none;}
    .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:25px;}
    .btn{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;}
    .btn-primary{background:#1a237e;color:#fff;}
    .btn-secondary{background:#e0e0e0;color:#333;}
    .toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#37474f;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:9999;}
  </style>
</head>
<body>
  <h2>📦 إضافة منتج جديد</h2>

  <div class="form-group">
    <label>اسم المنتج *</label>
    <input type="text" id="name" placeholder="مثال: تيشيرت قطن">
    <div class="error" id="err-name">الاسم مطلوب</div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>الفئة *</label>
      <select id="category">
        <option value="Apparel">Apparel</option>
        <option value="Accessories">Accessories</option>
        <option value="Footwear">Footwear</option>
        <option value="Home">Home</option>
        <option value="Electronics">Electronics</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>المتغير (Variant)</label>
      <input type="text" id="variant" placeholder="مثال: V1">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>اللون</label>
      <input type="text" id="color" placeholder="مثال: أسود">
    </div>
    <div class="form-group">
      <label>المقاس</label>
      <input type="text" id="size" placeholder="مثال: L">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>الكمية *</label>
      <input type="number" id="quantity" value="0" min="0">
    </div>
    <div class="form-group">
      <label>الحد الأدنى للتنبيه</label>
      <input type="number" id="minStock" value="5" min="0">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>التكلفة (ج.م)</label>
      <input type="number" id="cost" value="0" min="0" step="0.01">
    </div>
    <div class="form-group">
      <label>سعر البيع (ج.م)</label>
      <input type="number" id="price" value="0" min="0" step="0.01">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>المستودع</label>
      <input type="text" id="warehouse" value="Main">
    </div>
    <div class="form-group">
      <label>المورد</label>
      <input type="text" id="supplier" placeholder="اسم المورد">
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="google.script.host.close()">إلغاء</button>
    <button class="btn btn-primary" onclick="submitProduct()">💾 حفظ المنتج</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function validate(){
      let ok = true;
      const name = document.getElementById('name').value.trim();
      if(!name){
        document.getElementById('err-name').style.display = 'block';
        ok = false;
      } else {
        document.getElementById('err-name').style.display = 'none';
      }
      return ok;
    }

    function submitProduct(){
      if(!validate()) return;

      const btn = document.querySelector('.btn-primary');
      btn.textContent = '⏳ جاري الحفظ...';
      btn.disabled = true;

      const data = {
        name: document.getElementById('name').value.trim(),
        category: document.getElementById('category').value,
        variant: document.getElementById('variant').value.trim(),
        color: document.getElementById('color').value.trim(),
        size: document.getElementById('size').value.trim(),
        quantity: document.getElementById('quantity').value,
        minStock: document.getElementById('minStock').value,
        cost: document.getElementById('cost').value,
        price: document.getElementById('price').value,
        warehouse: document.getElementById('warehouse').value.trim(),
        supplier: document.getElementById('supplier').value.trim()
      };

      google.script.run
        .withSuccessHandler(res => {
          if(res.success){
            showToast('✅ ' + res.message);
            setTimeout(() => google.script.host.close(), 1200);
          } else {
            showToast('❌ ' + res.error, true);
            btn.textContent = '💾 حفظ المنتج';
            btn.disabled = false;
          }
        })
        .withFailureHandler(err => {
          showToast('❌ ' + err.message, true);
          btn.textContent = '💾 حفظ المنتج';
          btn.disabled = false;
        })
        .addProductFromDialog(data);
    }

    function showToast(msg, isError){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = isError ? '#C62828' : '#37474f';
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
  </script>
</body>
</html>
