     PHINOX BOS v6 — Registration Approval Module (Client-Side)
     ✅ FIXED: Server function names match UI_Server.js
     ✅ FIXED: Uses uiGetMembers() + uiGetPendingRegistrations() (no missing APIs)
     ==================================================================== -->

<!-- CSS: Registration Approval Styles -->
<style>
  .reg-stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .reg-stat-card {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: var(--transition);
  }
  .reg-stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .reg-stat-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .reg-stat-icon.pending { background: rgba(245,158,11,0.15); }
  .reg-stat-icon.approved { background: rgba(22,163,74,0.15); }
  .reg-stat-icon.rejected { background: rgba(220,38,38,0.15); }
  .reg-stat-icon.total { background: rgba(99,102,241,0.15); }
  .reg-stat-number { font-size: 28px; font-weight: 800; line-height: 1; }
  .reg-stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  
  .reg-pending-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
   }
  .reg-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px;
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    transition: var(--transition);
  }
  .reg-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(99,102,241,0.2); }
  .reg-card-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: white;
    flex-shrink: 0;
  }
  .reg-card-info { flex: 1; min-width: 0; }
  .reg-card-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .reg-card-email { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .reg-card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .reg-meta-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 10px;

    font-size: 11px;
    font-weight: 600;
  }
  .reg-meta-badge.role { background: rgba(99,102,241,0.15); color: var(--accent); }
  .reg-meta-badge.dept { background: rgba(14,165,233,0.15); color: var(--info); }
  .reg-meta-badge.time { background: rgba(100,116,139,0.15); color: var(--text-secondary); }
  .reg-card-actions { display: flex; gap: 8px; flex-shrink: 0; }
  
  .reg-history-table {
    width: 100%;
    border-collapse: collapse;
  }
  .reg-history-table th {
    text-align: right;
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid var(--bg-tertiary);
  }

    padding: 12px 16px;
    font-size: 13px;
    border-bottom: 1px solid var(--bg-tertiary);
  }
  .reg-history-table tr:hover td { background: var(--table-hover, rgba(99,102,241,0.03)); }
  
  .reg-tabs {
    display: flex; gap: 4px;
    margin-bottom: 20px;
    background: var(--bg-secondary);
    padding: 4px;
    border-radius: var(--radius);
    border: 1px solid var(--bg-tertiary);
  }
  .reg-tab-btn {
    padding: 10px 20px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: var(--transition);
  }
  .reg-tab-btn.active {
    background: var(--accent);
    color: white;
  }
  .reg-tab-btn:hover:not(.active) { color: var(--text-primary); background: var(--bg-tertiary); }

  }
</style>

<!-- HTML: Reject Registration Modal -->
<div class="modal-overlay" id="modalRejectReg">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">❌ رفض طلب التسجيل</div>
      <button class="modal-close" onclick="closeModal('modalRejectReg')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="rejectRegId">
      <p style="margin-bottom:12px;color:var(--text-secondary);">يجب إدخال سبب الرفض</p>
      <div class="form-group">
        <label class="form-label">سبب الرفض *</label>
        <textarea class="form-textarea" id="rejectRegReason" rows="3" placeholder="أدخل سبب رفض طلب التسجيل..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" onclick="confirmRejectReg()">تأكيد الرفض</button>
      <button class="btn btn-outline" onclick="closeModal('modalRejectReg')">إلغاء</button>
    </div>
  </div>
</div>

<!-- JavaScript: Registration Approval Logic -->
<script>
// Registration Approval Module - PHINOX BOS v6
// ✅ FIXED: Uses correct server function names from UI_Server.js
var _regCache = { pending: [], all: [], stats: null };

// ─── Main loader (called from navigateTo('registrations')) ───
function loadRegistrations() {
  // 1. جيب الأعضاء المعلّقين
  callServer('uiGetPendingRegistrations').then(function(res) {
    var data = (res.data && res.data.data) || res.data || [];
    _regCache.pending = Array.isArray(data) ? data : [];
    _renderPendingCards(_regCache.pending);
    _updateRegBadge(_regCache.pending.length);
  }).catch(function(err) {
    var container = document.getElementById('regPendingList');
    if (container) container.innerHTML = '<p style="color:var(--danger);">' + esc(err.message) + '</p>';
  });

  // 2. جيب كل الأعضاء لحساب الإحصائيات والسجل
  callServer('uiGetMembers').then(function(res) {
    var raw = (res.data && res.data.data) || res.data || [];
    var allMembers = Array.isArray(raw) ? raw : [];

    // حساب الإحصائيات
    var total = allMembers.length;
    var pending = 0, approved = 0, rejected = 0;
    for (var i = 0; i < allMembers.length; i++) {
      var s = String(allMembers[i].status || allMembers[i][5] || '').toLowerCase();
      if (s === 'pending') pending++;
      else if (s === 'active' || s === 'approved') approved++;
      else if (s === 'rejected' || s === 'inactive') rejected++;
    }
    _renderRegStats({ total: total, pending: pending, approved: approved, rejected: rejected });

    // تجهيز بيانات السجل (كل الأعضاء بما فيهم المرفوضين والمقبولين)
    _regCache.all = [];
    for (var j = 0; j < allMembers.length; j++) {
      var m = allMembers[j];
      // دعم المصفوفات (raw rows) والكائنات (mapped)
      if (Array.isArray(m)) {
        _regCache.all.push({
          id: String(m[0] || ''),
          fullName: String(m[1] || ''),
          role: String(m[2] || ''),
          email: String(m[3] || ''),
          department: String(m[12] || ''),
          status: String(m[5] || ''),
          joinDate: String(m[6] || '')
        });
      } else if (typeof m === 'object') {
        _regCache.all.push({
          id: String(m.id || ''),
          fullName: String(m.fullName || m.name || ''),
          role: String(m.role || ''),
          email: String(m.email || ''),
          department: String(m.department || ''),
          status: String(m.status || ''),
          joinDate: String(m.joinDate || '')
        });
      }
    }
    _renderRegHistory(_regCache.all);
  }).catch(function(err) {
    console.log('[RegApproval] Members load error:', err.message);
  });
}

// ─── Render Stats ───
function _renderRegStats(stats) {
  _regSetText('regStatTotal', stats.total || 0);
  _regSetText('regStatPending', stats.pending || 0);
  _regSetText('regStatApproved', stats.approved || 0);
  _regSetText('regStatRejected', stats.rejected || 0);
}

function _regSetText(id, val) {
  var el = document.getElementById(id);
  if (el) el.textContent = val;
}

// ─── Render Pending Cards ───
function _renderPendingCards(list) {
  var container = document.getElementById('regPendingList');
  var empty = document.getElementById('regNoPending');
  if (!container) return;

  if (!list || !list.length) {
    container.innerHTML = '';
    if (empty) empty.style.display = 'flex';
    return;
  }
  if (empty) empty.style.display = 'none';

  var html = '';
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    // دعم المصفوفات والكائنات
    var rName = r.fullName || r.name || (Array.isArray(r) ? r[1] : '');
    var rEmail = r.email || (Array.isArray(r) ? r[3] : '');
    var rRole = r.role || (Array.isArray(r) ? r[2] : '');
    var rDept = r.department || (Array.isArray(r) ? r[12] : '');
    var rId = r.id || (Array.isArray(r) ? r[0] : '');
    var rDate = r.joinDate || r.requestedAt || (Array.isArray(r) ? r[6] : '');

    var avatarColor = _regAvatarColor(rEmail);
    var initials = _regInitials(rName);
    var timeAgo = _regTimeAgo(rDate);

    html += '<div class="reg-card">'
      + '<div class="reg-card-avatar" style="background:' + avatarColor + ';">' + initials + '</div>'
      + '<div class="reg-card-info">'
      + '<div class="reg-card-name">' + esc(rName || 'بدون اسم') + '</div>'
      + '<div class="reg-card-email">' + esc(rEmail) + '</div>'
      + '<div class="reg-card-meta">'
      + '<span class="reg-meta-badge role">' + esc(rRole || '-') + '</span>'
      + (rDept ? '<span class="reg-meta-badge dept">' + esc(rDept) + '</span>' : '')
      + '<span class="reg-meta-badge time">' + esc(timeAgo) + '</span>'
      + '</div>'
      + '</div>'
      + '<div class="reg-card-actions">'
      + '<button class="btn btn-primary" style="font-size:13px;padding:8px 16px;" onclick="approveRegRequest(\'' + escAttr(rId) + '\')">✅ قبول</button>'
      + '<button class="btn btn-danger" style="font-size:13px;padding:8px 16px;" onclick="openRejectRegModal(\'' + escAttr(rId) + '\')">❌ رفض</button>'
      + '</div>'
      + '</div>';
  }
  container.innerHTML = html;
}

// ─── Render History Table ───
function _renderRegHistory(list) {
  var tbody = document.getElementById('regHistoryBody');
  if (!tbody) return;

  if (!list || !list.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-secondary);">لا توجد سجلات</td></tr>';
    return;
  }

  var html = '';
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    var statusBadge = '';
    var s = String(r.status || '').toLowerCase();
    if (s === 'active' || s === 'approved') {
      statusBadge = '<span class="badge badge-success">مقبول</span>';
    } else if (s === 'rejected' || s === 'inactive') {
      statusBadge = '<span class="badge badge-danger">مرفوض</span>';
    } else {
      statusBadge = '<span class="badge badge-warning">معلق</span>';
    }

    html += '<tr>'
      + '<td>' + esc(r.id || '-') + '</td>'
      + '<td>' + esc(r.fullName || '-') + '</td>'
      + '<td>' + esc(r.email || '-') + '</td>'
      + '<td>' + esc(r.role || '-') + '</td>'
      + '<td>' + esc(r.department || '-') + '</td>'
      + '<td>' + statusBadge + '</td>'
      + '<td>' + esc(r.joinDate || '-') + '</td>'
      + '</tr>';
  }
  tbody.innerHTML = html;
}

// ─── Approve ───
// ✅ FIXED: uiApproveRegistration → uiApproveMember (matches UI_Server.js)
function approveRegRequest(memberId) {
  if (!confirm('هل تريد قبول طلب التسجيل هذا؟')) return;
  callServer('uiApproveMember', memberId, {}).then(function(res) {
    var result = (res.data && res.data.data) || res.data || res;
    if (result && result.success === false) {
      showToast(result.error || 'حدث خطأ', 'error');
    } else {
      showToast('تم قبول طلب التسجيل بنجاح', 'success');
      loadRegistrations();
    }
  }).catch(function(err) {
    showToast(err.message || 'حدث خطأ في القبول', 'error');
  });
}

// ─── Reject (open modal) ───
function openRejectRegModal(memberId) {
  document.getElementById('rejectRegId').value = memberId;
  document.getElementById('rejectRegReason').value = '';
  openModal('modalRejectReg');
}

// ─── Reject (confirm) ───
// ✅ FIXED: uiRejectRegistration → uiRejectMember (matches UI_Server.js)
function confirmRejectReg() {
  var memberId = document.getElementById('rejectRegId').value;
  var reason = document.getElementById('rejectRegReason').value;
  if (!reason || !reason.trim()) {
    showToast('يجب إدخال سبب الرفض', 'error');
    return;
  }
  callServer('uiRejectMember', memberId, reason.trim()).then(function(res) {
    var result = (res.data && res.data.data) || res.data || res;
    if (result && result.success === false) {
      showToast(result.error || 'حدث خطأ', 'error');
    } else {
      showToast('تم رفض طلب التسجيل', 'success');
      closeModal('modalRejectReg');
      loadRegistrations();
    }
  }).catch(function(err) {
    showToast(err.message || 'حدث خطأ في الرفض', 'error');
  });
}

// ─── Tab switching ───
function switchRegTab(tab) {
  var btns = document.querySelectorAll('.reg-tab-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].getAttribute('data-reg-tab') === tab);
  }
  var contents = document.querySelectorAll('.reg-tab-content');
  for (var j = 0; j < contents.length; j++) {
    contents[j].classList.toggle('active', contents[j].getAttribute('data-reg-tab') === tab);
  }
}

// ─── Filter registrations ───
function filterRegistrations() {
  var search = (document.getElementById('regSearch').value || '').toLowerCase();
  var statusFilter = document.getElementById('regStatusFilter') ? document.getElementById('regStatusFilter').value : '';
  var filtered = _regCache.all.filter(function(r) {
    if (statusFilter) {
      var rs = String(r.status || '').toLowerCase();
      if (statusFilter === 'approved' && rs !== 'active' && rs !== 'approved') return false;
      if (statusFilter === 'rejected' && rs !== 'rejected' && rs !== 'inactive') return false;
      if (statusFilter === 'pending' && rs !== 'pending') return false;
    }
    if (search) {
      var match = (r.fullName || '').toLowerCase().indexOf(search) > -1 ||
                  (r.email || '').toLowerCase().indexOf(search) > -1 ||
                  (r.id || '').toLowerCase().indexOf(search) > -1;
      if (!match) return false;
    }
    return true;
  });
  _renderRegHistory(filtered);
}

// ─── Update nav badge ───
function _updateRegBadge(count) {
  var badge = document.getElementById('badge-members');
  if (!badge) return;
  if (count > 0) {
    badge.style.display = 'inline-flex';
    badge.textContent = count > 99 ? '99+' : count;
  } else {
    badge.style.display = 'none';
  }
  _notifications.pendingRegistrations = count;
}

// ─── Helpers ───
function _regInitials(name) {
  if (!name) return '?';
  var parts = name.split(' ');
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.substring(0, 2).toUpperCase();
}

function _regAvatarColor(email) {
  if (!email) return '#6366F1';
  var colors = ['#6366F1','#8B5CF6','#EC4899','#F59E0B','#22C55E','#06B6D4','#EF4444','#3B82F6'];
  var hash = 0;
  for (var i = 0; i < email.length; i++) hash = email.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function _regTimeAgo(dateStr) {
  if (!dateStr) return '';
  try {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    var now = new Date();
    var diff = Math.floor((now - d) / 1000);
    if (diff < 60) return 'الآن';
    if (diff < 3600) return 'منذ ' + Math.floor(diff / 60) + ' دقيقة';
    if (diff < 86400) return 'منذ ' + Math.floor(diff / 3600) + ' ساعة';
    return 'منذ ' + Math.floor(diff / 86400) + ' يوم';
  } catch(e) { return ''; }
}
</script>
